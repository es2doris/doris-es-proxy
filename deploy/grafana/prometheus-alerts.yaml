apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: doris-es-proxy-alerts
  labels:
    app.kubernetes.io/name: doris-es-proxy
spec:
  groups:
    - name: doris-es-proxy.rules
      rules:
        - alert: DorisESProxyDown
          expr: up{job=~".*doris-es-proxy.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "doris-es-proxy instance is unreachable"
            description: "Prometheus failed to scrape {{ $labels.instance }} for more than 2 minutes."

        - alert: DorisESProxyShadowParityDrop
          expr: >
            (sum(doris_es_proxy_shadow_queries_total) > 20)
            and
            ((sum(doris_es_proxy_shadow_parity_matches_total) / clamp_min(sum(doris_es_proxy_shadow_queries_total), 1)) < 0.95)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "doris-es-proxy dual-read shadow hit-count parity dropped below 95%"
            description: "Inspect GET /_doris/shadow_stats to review divergent queries between Apache Doris and legacy Elasticsearch."

        - alert: DorisESProxyUnindexedVariantSpike
          expr: sum(rate(doris_es_proxy_unindexed_variant_accesses_total[5m])) > 5
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "High rate of unindexed _doc[...] VARIANT field queries"
            description: "Enable --auto-promote or inspect GET /_doris/slowlog to promote hot VARIANT fields to f__* USING INVERTED columns."
