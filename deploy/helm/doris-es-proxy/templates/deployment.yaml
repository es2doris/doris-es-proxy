apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doris-es-proxy.fullname" . }}
  labels:
    {{- include "doris-es-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doris-es-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "doris-es-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--listen=:{{ .Values.service.port }}"
            - "--doris-dsn={{ .Values.doris.user }}:$(DORIS_PASSWORD)@tcp({{ .Values.doris.feHost }}:{{ .Values.doris.mysqlPort }})/{{ .Values.doris.database }}?interpolateParams=true&timeout=5s&readTimeout=30s&writeTimeout=30s"
            - "--doris-http=http://{{ .Values.doris.feHost }}:{{ .Values.doris.httpPort }}"
            - "--doris-db={{ .Values.doris.database }}"
            - "--doris-user={{ .Values.doris.user }}"
            - "--doris-password=$(DORIS_PASSWORD)"
            {{- if .Values.doris.useDoris4SearchFunc }}
            - "--doris4-search-fn=true"
            {{- end }}
            {{- if .Values.doris.autoPromote }}
            - "--auto-promote=true"
            {{- end }}
            {{- if gt (int .Values.doris.bulkCoalesceMs) 0 }}
            - "--bulk-coalesce-ms={{ int .Values.doris.bulkCoalesceMs }}"
            - "--bulk-coalesce-bytes={{ int .Values.doris.bulkCoalesceBytes }}"
            {{- end }}
            {{- if and .Values.doris.queryCacheTTL (ne .Values.doris.queryCacheTTL "0s") }}
            - "--query-cache-ttl={{ .Values.doris.queryCacheTTL }}"
            {{- end }}
            {{- if .Values.doris.logSQL }}
            - "--log-sql=true"
            {{- end }}
            {{- if .Values.shadow.esURL }}
            - "--shadow-es-url={{ .Values.shadow.esURL }}"
            {{- end }}
          env:
            - name: DORIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.doris.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: {{ if .Values.doris.existingSecret }}{{ .Values.doris.existingSecretPasswordKey }}{{ else }}DORIS_PASSWORD{{ end }}
            {{- if or .Values.auth.basicAuthUser .Values.auth.basicAuthPass .Values.auth.apiKey .Values.auth.existingSecret }}
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: BASIC_AUTH_USER
                  optional: true
            - name: BASIC_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: BASIC_AUTH_PASS
                  optional: true
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: API_KEY
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
