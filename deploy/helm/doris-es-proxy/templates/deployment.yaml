apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doris-es-proxy.fullname" . }}
  labels:
    {{- include "doris-es-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doris-es-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "doris-es-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $dorisHTTP := .Values.doris.httpEndpoint | default (printf "%s://%s:%d" (.Values.doris.httpScheme | default "http") .Values.doris.feHost (int .Values.doris.httpPort)) }}
          args:
            - "--listen=:{{ .Values.service.port }}"
            - "--doris-dsn={{ .Values.doris.user }}:$(DORIS_PASSWORD)@tcp({{ .Values.doris.feHost }}:{{ .Values.doris.mysqlPort }})/?interpolateParams=true&timeout=5s&readTimeout=30s&writeTimeout=30s{{ if .Values.doris.dsnParams }}&{{ .Values.doris.dsnParams }}{{ end }}"
            - "--doris-http={{ $dorisHTTP }}"
            - "--doris-db={{ .Values.doris.database }}"
            - "--doris-user={{ .Values.doris.user }}"
            - "--doris-password=$(DORIS_PASSWORD)"
            - "--bm25-mode={{ .Values.bm25.mode }}"
            - "--bm25-max-rows={{ int .Values.bm25.maxRows }}"
            - "--doris-replication-num={{ int .Values.doris.replicationNum }}"
            {{- if .Values.doris.replicationAllocation }}
            - "--doris-replication-allocation={{ .Values.doris.replicationAllocation }}"
            {{- end }}
            {{- if .Values.doris.cloudMode }}
            - "--doris-cloud=true"
            {{- end }}
            {{- if .Values.doris.bucketsAuto }}
            - "--doris-buckets-auto=true"
            {{- end }}
            - "--doris-store-row-column={{ .Values.doris.storeRowColumn }}"
            - "--doris-vector-ann={{ .Values.doris.vectorANN }}"
            - "--catalog-sync-interval={{ .Values.catalogSync.interval }}"
            - "--doris-max-open-conns={{ int .Values.doris.maxOpenConns }}"
            - "--doris-max-idle-conns={{ int .Values.doris.maxIdleConns }}"
            - "--doris-conn-max-lifetime={{ .Values.doris.connMaxLifetime }}"
            - "--log-format={{ .Values.logging.format }}"
            - "--log-level={{ .Values.logging.level }}"
            {{- if .Values.doris.useDoris4SearchFunc }}
            - "--doris4-search-fn=true"
            {{- end }}
            {{- if .Values.doris.autoPromote }}
            - "--auto-promote=true"
            {{- end }}
            {{- if gt (int .Values.doris.bulkCoalesceMs) 0 }}
            - "--bulk-coalesce-ms={{ int .Values.doris.bulkCoalesceMs }}"
            - "--bulk-coalesce-bytes={{ int .Values.doris.bulkCoalesceBytes }}"
            {{- end }}
            {{- if and .Values.doris.queryCacheTTL (ne .Values.doris.queryCacheTTL "0s") }}
            - "--query-cache-ttl={{ .Values.doris.queryCacheTTL }}"
            {{- end }}
            {{- if .Values.doris.logSQL }}
            - "--log-sql=true"
            {{- end }}
            {{- if .Values.shadow.esURL }}
            - "--shadow-es-url={{ .Values.shadow.esURL }}"
            {{- end }}
            {{- if .Values.tls.enabled }}
            - "--tls-cert={{ .Values.tls.certFile }}"
            - "--tls-key={{ .Values.tls.keyFile }}"
            {{- end }}
          env:
            - name: DORIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.doris.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: {{ if .Values.doris.existingSecret }}{{ .Values.doris.existingSecretPasswordKey }}{{ else }}DORIS_PASSWORD{{ end }}
            {{- if or .Values.auth.basicAuthUser .Values.auth.basicAuthPass .Values.auth.apiKey .Values.auth.existingSecret }}
            - name: BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: {{ .Values.auth.existingSecretBasicAuthUserKey | default "BASIC_AUTH_USER" }}
                  optional: true
            - name: BASIC_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: {{ .Values.auth.existingSecretBasicAuthPassKey | default "BASIC_AUTH_PASS" }}
                  optional: true
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (include "doris-es-proxy.fullname" .) }}
                  key: {{ .Values.auth.existingSecretApiKeyKey | default "API_KEY" }}
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- if and .Values.lifecycle (gt (int .Values.lifecycle.preStopSleepSeconds) 0) }}
          lifecycle:
            preStop:
              exec:
                command: ["/doris-es-proxy", "sleep", "{{ int .Values.lifecycle.preStopSleepSeconds }}s"]
          {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/doris-es-proxy/tls
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.existingSecret | default (printf "%s-tls" (include "doris-es-proxy.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
