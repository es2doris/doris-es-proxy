apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doris-es-proxy.fullname" . }}
  labels:
    {{- include "doris-es-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "doris-es-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "doris-es-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--listen=:{{ .Values.service.port }}"
            - "--doris-mysql={{ .Values.doris.user }}:$(DORIS_PASSWORD)@tcp({{ .Values.doris.feHost }}:{{ .Values.doris.mysqlPort }})/{{ .Values.doris.database }}"
            - "--doris-http=http://{{ .Values.doris.feHost }}:{{ .Values.doris.httpPort }}"
            - "--doris-db={{ .Values.doris.database }}"
            - "--doris-user={{ .Values.doris.user }}"
            - "--doris-password=$(DORIS_PASSWORD)"
            {{- if .Values.doris.useDoris4SearchFunc }}
            - "--doris4-search=true"
            {{- end }}
            {{- if gt (int .Values.doris.autoPromoteThreshold) 0 }}
            - "--auto-promote-threshold={{ int .Values.doris.autoPromoteThreshold }}"
            {{- end }}
            {{- if .Values.doris.logSQL }}
            - "--log-sql=true"
            {{- end }}
            {{- if .Values.shadow.esURL }}
            - "--shadow-es-url={{ .Values.shadow.esURL }}"
            {{- end }}
          env:
            - name: DORIS_PASSWORD
              {{- if .Values.doris.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.doris.existingSecret }}
                  key: {{ .Values.doris.existingSecretPasswordKey }}
              {{- else }}
              value: {{ .Values.doris.password | quote }}
              {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
