{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "doris-es-proxy.fullname" . }}
  labels:
    {{- include "doris-es-proxy.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "doris-es-proxy.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      {{- if .Values.tls.enabled }}
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
      {{- $authSecretName := default (include "doris-es-proxy.fullname" .) .Values.auth.existingSecret }}
      {{- if or .Values.auth.existingSecret (and .Values.auth.basicAuthUser .Values.auth.basicAuthPass) }}
      basicAuth:
        username:
          name: {{ $authSecretName }}
          key: BASIC_AUTH_USER
        password:
          name: {{ $authSecretName }}
          key: BASIC_AUTH_PASS
      {{- else if .Values.auth.apiKey }}
      authorization:
        type: ApiKey
        credentials:
          name: {{ $authSecretName }}
          key: API_KEY
      {{- end }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
