{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "doris-es-proxy.fullname" . }}
  labels:
    {{- include "doris-es-proxy.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "doris-es-proxy.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      {{- if .Values.tls.enabled }}
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
      {{- $authSecretName := default (include "doris-es-proxy.fullname" .) .Values.auth.existingSecret }}
      {{- $basicUserKey := .Values.auth.existingSecretBasicAuthUserKey | default "BASIC_AUTH_USER" }}
      {{- $basicPassKey := .Values.auth.existingSecretBasicAuthPassKey | default "BASIC_AUTH_PASS" }}
      {{- $apiKeyKey := .Values.auth.existingSecretApiKeyKey | default "API_KEY" }}
      {{- $hasBasic := or (and .Values.auth.basicAuthUser .Values.auth.basicAuthPass) (and .Values.auth.existingSecret (or .Values.auth.existingSecretBasicAuthUserKey .Values.auth.existingSecretBasicAuthPassKey)) }}
      {{- $hasApiKey := or .Values.auth.apiKey (and .Values.auth.existingSecret .Values.auth.existingSecretApiKeyKey) }}
      {{- if $hasBasic }}
      basicAuth:
        username:
          name: {{ $authSecretName }}
          key: {{ $basicUserKey }}
        password:
          name: {{ $authSecretName }}
          key: {{ $basicPassKey }}
      {{- else if $hasApiKey }}
      authorization:
        type: ApiKey
        credentials:
          name: {{ $authSecretName }}
          key: {{ $apiKeyKey }}
      {{- else if .Values.auth.existingSecret }}
      basicAuth:
        username:
          name: {{ $authSecretName }}
          key: {{ $basicUserKey }}
        password:
          name: {{ $authSecretName }}
          key: {{ $basicPassKey }}
      {{- end }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
