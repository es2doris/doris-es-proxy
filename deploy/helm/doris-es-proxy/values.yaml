replicaCount: 2

image:
  repository: ghcr.io/es2doris/doris-es-proxy
  pullPolicy: IfNotPresent
  tag: "v0.5.0"

service:
  type: ClusterIP
  port: 9200

doris:
  database: "es_compat"
  dsn: "root:@tcp(doris-fe-service:9030)/?interpolateParams=true&timeout=5s&readTimeout=30s&writeTimeout=30s"
  existingSecret: ""
  existingSecretDsnKey: "DORIS_DSN"
  httpEndpoint: "http://doris-fe-service:8030"
  user: "root"
  password: ""
  doris4SearchFn: false
  autoPromote: false
  logSql: false
  shadowEsUrl: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
