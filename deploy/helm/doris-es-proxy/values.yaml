replicaCount: 2

image:
  repository: ghcr.io/es2doris/doris-es-proxy
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

doris:
  feHost: "doris-fe"
  mysqlPort: 9030
  httpScheme: "http"
  httpPort: 8030
  # Optional full comma-separated Doris FE HTTP/HTTPS endpoints (overrides httpScheme/feHost/httpPort), e.g. "https://fe1:8030,https://fe2:8030"
  httpEndpoint: ""
  # Optional extra MySQL DSN query parameters, e.g. "tls=true"
  dsnParams: ""
  database: "es_compat"
  user: "root"
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "doris-password"
  useDoris4SearchFunc: false
  autoPromote: false
  bulkCoalesceMs: 0
  bulkCoalesceBytes: 8388608
  queryCacheTTL: "0s"
  logSQL: false
  replicationNum: 1
  replicationAllocation: ""
  cloudMode: false
  bucketsAuto: false
  storeRowColumn: true
  vectorANN: "off"
  maxOpenConns: 50
  maxIdleConns: 10
  connMaxLifetime: "5m"

bm25:
  mode: "auto"
  maxRows: 50000

catalogSync:
  interval: "5s"

logging:
  format: "json"
  level: "info"

auth:
  basicAuthUser: ""
  basicAuthPass: ""
  apiKey: ""
  existingSecret: ""
  existingSecretBasicAuthUserKey: ""
  existingSecretBasicAuthPassKey: ""
  existingSecretApiKeyKey: ""

tls:
  enabled: false
  existingSecret: ""
  certFile: "/etc/doris-es-proxy/tls/tls.crt"
  keyFile: "/etc/doris-es-proxy/tls/tls.key"

shadow:
  esURL: ""

service:
  type: ClusterIP
  port: 9200
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

podAnnotations: {}
podLabels: {}

terminationGracePeriodSeconds: 30

lifecycle:
  preStopSleepSeconds: 5

startupProbe:
  enabled: true
  initialDelaySeconds: 2
  periodSeconds: 3
  timeoutSeconds: 3
  failureThreshold: 20

nodeSelector: {}
tolerations: []
affinity: {}
