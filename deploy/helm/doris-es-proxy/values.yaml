replicaCount: 2

image:
  repository: ghcr.io/es2doris/doris-es-proxy
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

doris:
  feHost: "doris-fe"
  mysqlPort: 9030
  httpPort: 8030
  database: "es_compat"
  user: "root"
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "doris-password"
  useDoris4SearchFunc: false
  autoPromote: false
  bulkCoalesceMs: 0
  bulkCoalesceBytes: 8388608
  queryCacheTTL: "0s"
  logSQL: false

auth:
  basicAuthUser: ""
  basicAuthPass: ""
  apiKey: ""
  existingSecret: ""

shadow:
  esURL: ""

service:
  type: ClusterIP
  port: 9200
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
