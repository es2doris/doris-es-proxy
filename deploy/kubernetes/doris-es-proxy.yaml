---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-es-proxy
  labels:
    app.kubernetes.io/name: doris-es-proxy
    app.kubernetes.io/part-of: apache-doris
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: doris-es-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doris-es-proxy
    spec:
      containers:
        - name: doris-es-proxy
          image: ghcr.io/es2doris/doris-es-proxy:latest
          ports:
            - name: http-es
              containerPort: 9200
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":9200"
            - name: DORIS_DB
              value: "es_compat"
            - name: DORIS_DSN
              value: "root:@tcp(doris-fe-service:9030)/?interpolateParams=true&timeout=5s&readTimeout=30s&writeTimeout=30s"
            - name: DORIS_HTTP
              value: "http://doris-fe-service:8030"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-es
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-es
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: doris-es-proxy
  labels:
    app.kubernetes.io/name: doris-es-proxy
spec:
  type: ClusterIP
  ports:
    - name: http-es
      port: 9200
      targetPort: http-es
      protocol: TCP
  selector:
    app.kubernetes.io/name: doris-es-proxy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: doris-es-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doris-es-proxy
