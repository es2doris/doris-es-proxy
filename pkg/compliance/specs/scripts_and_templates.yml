---
"Stored scripts CRUD and Painless execute":
  - do:
      put_script:
        id: "multiply_score"
        body:
          script:
            lang: "painless"
            source: "doc['val'].value * params.factor"
  - match: { acknowledged: true }

  - do:
      exists_script:
        id: "multiply_score"
  - is_true: ""

  - do:
      put_script:
        id: "multiply_score_ctx"
        context: "score"
        body:
          script:
            lang: "painless"
            source: "doc['val'].value * 2"
  - match: { acknowledged: true }

  - do:
      get_script:
        id: "multiply_score"
  - match: { _id: "multiply_score" }
  - match: { found: true }
  - match: { script.lang: "painless" }
  - match: { script.source: "doc['val'].value * params.factor" }

  - do:
      scripts_painless_execute:
        body:
          script:
            id: "multiply_score"
            params:
              factor: 3
          context: "score"
          context_setup:
            index: "test_exec"
            document:
              val: 7
  - match: { result: 21.0 }

  - do:
      scripts_painless_execute:
        body:
          script:
            source: "doc['val'].value > 5"
          context: "filter"
          context_setup:
            index: "test_exec"
            document:
              val: 7
  - match: { result: true }

  - do:
      scripts_painless_execute:
        body:
          script:
            source: "ctx.status = 'processed'"
          context: "ingest"
          context_setup:
            document:
              title: "raw_doc"
  - match: { result.status: "processed" }
  - is_false: result.__raw_source

  - do:
      catch: bad_request
      put_script:
        id: "invalid_lang_script"
        body:
          script:
            lang: "unsupported_lang"
            source: "1 + 1"

  - do:
      catch: bad_request
      put_script:
        id: "invalid_ctx_script"
        context: "non_existent_context"
        body:
          script:
            lang: "painless"
            source: "1 + 1"

  - do:
      delete_script:
        id: "multiply_score"
  - match: { acknowledged: true }

  - do:
      exists_script:
        id: "multiply_score"
  - is_false: ""

  - do:
      catch: missing
      get_script:
        id: "multiply_score"

---
"Mustache search template render and execution":
  - do:
      put_script:
        id: "tpl_by_status"
        body:
          script:
            lang: "mustache"
            source:
              query:
                term:
                  status: "{{status}}"
              size: "{{size}}{{^size}}10{{/size}}"
  - match: { acknowledged: true }

  - do:
      render_search_template:
        id: "tpl_by_status"
        body:
          params:
            status: "published"
  - match: { template_output.query.term.status: "published" }
  - match: { template_output.size: 10 }

  - do:
      render_search_template:
        body:
          source:
            query:
              terms:
                tags: "{{#toJson}}tags{{/toJson}}"
            aggs:
              joined:
                meta:
                  csv: "{{#join delimiter='|'}}tags{{/join}}"
                  encoded: "{{#url}}{{raw_url}}{{/url}}"
          params:
            tags: ["go", "doris"]
            raw_url: "a b/c"
  - match: { template_output.query.terms.tags.0: "go" }
  - match: { template_output.query.terms.tags.1: "doris" }
  - match: { template_output.aggs.joined.meta.csv: "go|doris" }
  - match: { template_output.aggs.joined.meta.encoded: "a%20b%2Fc" }

  - do:
      index:
        index: "tpl_articles"
        id: "1"
        refresh: true
        body:
          title: "Doris ES Proxy"
          status: "published"

  - do:
      index:
        index: "tpl_articles"
        id: "2"
        refresh: true
        body:
          title: "Draft Post"
          status: "draft"

  - do:
      search_template:
        index: "tpl_articles"
        body:
          id: "tpl_by_status"
          params:
            status: "published"
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }

  - do:
      msearch_template:
        index: "tpl_articles"
        body:
          - {}
          - id: "tpl_by_status"
            params:
              status: "draft"
          - {}
          - id: "tpl_by_status"
            params:
              status: "published"
  - length: { responses: 2 }
  - match: { responses.0.hits.total.value: 1 }
  - match: { responses.0.hits.hits.0._id: "2" }
  - match: { responses.1.hits.total.value: 1 }
  - match: { responses.1.hits.hits.0._id: "1" }
