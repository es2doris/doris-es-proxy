---
"Pinned, MoreLikeThis, Percolate, and Join queries":
  - do:
      index:
        index: "r48_books"
        id: "b1"
        refresh: true
        body:
          title: "distributed systems with apache doris"
          category: "database"

  - do:
      index:
        index: "r48_books"
        id: "b2"
        refresh: true
        body:
          title: "search analytics with elasticsearch and doris"
          category: "search"

  - do:
      index:
        index: "r48_books"
        id: "b3"
        refresh: true
        body:
          title: "modern cooking recipes"
          category: "food"

  - do:
      search:
        index: "r48_books"
        body:
          query:
            pinned:
              ids: ["b3"]
              organic:
                match_all: {}
  - match: { hits.total.value: 3 }
  - match: { hits.hits.0._id: "b3" }

  - do:
      search:
        index: "r48_books"
        body:
          query:
            more_like_this:
              fields: ["title"]
              like: "doris"
              min_term_freq: 1
              min_doc_freq: 1
  - match: { hits.total.value: 2 }

  - do:
      indices.create:
        index: "r48_perc"
        body:
          mappings:
            properties:
              query:
                type: "percolator"
              severity:
                type: "keyword"

  - do:
      index:
        index: "r48_perc"
        id: "rule_crit"
        refresh: true
        body:
          query:
            term:
              severity: "critical"

  - do:
      search:
        index: "r48_perc"
        body:
          query:
            percolate:
              field: "query"
              document:
                severity: "critical"
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "rule_crit" }
