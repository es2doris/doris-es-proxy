"Round 57 AST, Schema, Shredder, Transpiler, Lucene & Painless JLS Compliance":
  # F13, F14, F15, F16, F17, F18: Schema validation, immutability, cosine zero-vector, unsigned_long, and multi-valued range arrays
  - do:
      catch: bad_request
      indices.create:
        index: r57_bad_alias_idx
        body:
          mappings:
            properties:
              real_f: { type: keyword }
              alias_f: { type: alias, path: "real_f", store: true }

  - do:
      catch: bad_request
      indices.create:
        index: r57_bad_dyntpl_idx
        body:
          mappings:
            dynamic_templates:
              - bad_re:
                  match_pattern: regex
                  path_match: "[unclosed"
                  mapping:
                    type: keyword

  - do:
      indices.create:
        index: r57_schema_idx
        body:
          mappings:
            properties:
              title: { type: text }
              code: { type: keyword }
              code_alias: { type: alias, path: "code" }
              env_const: { type: constant_keyword, value: "prod" }
              ts: { type: date, format: "strict_date_optional_time" }
              vec: { type: dense_vector, dims: 3 }
              u64: { type: unsigned_long }
              int_ranges: { type: integer_range }
              flt_ranges: { type: float_range }
  - match: { acknowledged: true }

  # F14: PUT _mapping immutability rejections
  - do:
      catch: bad_request
      indices.put_mapping:
        index: r57_schema_idx
        body:
          properties:
            env_const: { type: constant_keyword, value: "staging" }

  - do:
      catch: bad_request
      indices.put_mapping:
        index: r57_schema_idx
        body:
          properties:
            code: { type: keyword, store: true }

  - do:
      catch: bad_request
      indices.put_mapping:
        index: r57_schema_idx
        body:
          properties:
            ts: { type: date, format: "epoch_millis" }

  - do:
      catch: bad_request
      indices.put_mapping:
        index: r57_schema_idx
        body:
          properties:
            vec: { type: dense_vector, dims: 3, similarity: "dot_product" }

  # F13: Read-only write rejection on alias field
  - do:
      catch: bad_request
      index:
        index: r57_schema_idx
        id: "bad-alias-write"
        body:
          code_alias: "forbidden"

  # F16: cosine zero-magnitude vector rejected on ingest & kNN search + k > 10000 rejected
  - do:
      catch: bad_request
      index:
        index: r57_schema_idx
        id: "bad-zero-vec"
        body:
          vec: [0.0, 0.0, 0.0]

  - do:
      bulk:
        index: r57_schema_idx
        refresh: true
        body:
          - index: { _id: "1" }
          - title: "to"
            code: "A"
            ts: "2026-01-01T00:00:00Z"
            vec: [1.0, 0.0, 0.0]
            u64: 9223372036854775807
            int_ranges: [{ gte: 1, lte: 5 }, { gte: 20, lte: 30 }]
            flt_ranges: { gt: 10.0, lt: 20.0 }
          - index: { _id: "2" }
          - title: "quick"
            code: "B"
            ts: "2026-01-02T00:00:00Z"
            vec: [0.0, 1.0, 0.0]
            u64: 18446744073709551615
            int_ranges: [{ gte: 10, lte: 15 }]
  - match: { errors: false }

  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          knn:
            field: "vec"
            query_vector: [0.0, 0.0, 0.0]
            k: 1
            num_candidates: 5

  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          knn:
            field: "vec"
            query_vector: [1.0, 0.0, 0.0]
            k: 10001
            num_candidates: 10001

  # F10: fixed_interval calendar unit & composite duplicate source rejected
  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          size: 0
          aggs:
            by_month:
              date_histogram:
                field: "ts"
                fixed_interval: "1M"

  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          size: 0
          aggs:
            dup_comp:
              composite:
                sources:
                  - k1: { terms: { field: "code" } }
                  - k1: { terms: { field: "code" } }

  # F11: PinnedQuery _index filtering & RuleQuerySpec missing organic rejected
  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            pinned:
              docs:
                - { _index: "other_unrelated_idx", _id: "2" }
                - { _index: "r57_schema_idx", _id: "1" }
              organic:
                term: { code: "B" }
  - match: { hits.hits.0._id: "1" }

  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          query:
            rule_query:
              ruleset_id: "rs1"
              match_criteria: { q: "test" }

  # F12: Malformed AUTO:6,3 rejected & 2-char "go" with AUTO has 0 edits (does not match "to")
  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          query:
            match:
              title:
                query: "quick"
                fuzziness: "AUTO:6,3"

  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            match:
              title:
                query: "go"
                fuzziness: "AUTO"
  - match: { hits.total.value: 0 }

  # F17: unsigned_long exact precision above MaxInt64
  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            term:
              u64: 9223372036854775807
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }

  - do:
      search:
        index: r57_schema_idx
        body:
          sort:
            - u64: { order: "desc" }
          aggs:
            u_terms:
              terms:
                field: "u64"
  - match: { hits.hits.0._id: "2" }
  - length: { aggregations.u_terms.buckets: 2 }

  # F18: Multi-valued integer_range per-element correlation & float_range CONTAINS exclusive gt/lt
  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            range:
              int_ranges:
                gte: 22
                lte: 25
                relation: "intersects"
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "1" }

  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            range:
              int_ranges:
                gte: 6
                lte: 9
                relation: "intersects"
  - match: { hits.total.value: 0 }

  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            range:
              flt_ranges:
                gt: 10.0
                lt: 20.0
                relation: "contains"
  - match: { hits.total.value: 1 }

  # F19: query_string ~AUTO:3,6 fuzzy suffix & malformed range bracket rejection
  - do:
      search:
        index: r57_schema_idx
        body:
          query:
            query_string:
              query: "title:quikc~AUTO:3,6"
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "2" }

  - do:
      catch: bad_request
      search:
        index: r57_schema_idx
        body:
          query:
            query_string:
              query: "u64:[10 TO]"

  # F20-F26: Painless JLS shifts, narrowing/overflow, Math.*Exact, BigDecimal.divide/equals, String.split regex, exception hierarchy & typed Map.computeIfAbsent
  - do:
      scripts_painless_execute:
        body:
          script:
            source: |
              int shInt = 1 << 32;
              long shLong = 1L << 32;
              byte satByte = (byte) 5e9;
              int ovf = 2147483647;
              ovf++;
              boolean exactCaught = false;
              try {
                Math.addExact(2147483647, 1);
              } catch (ArithmeticException e) {
                exactCaught = true;
              }
              BigDecimal q = new BigDecimal("1").divide(new BigDecimal("8"));
              boolean bdScaleStrict = !new BigDecimal("1.0").equals(new BigDecimal("1.00"));
              int splitEsc = "a.b.c".split("\\.").length;
              int splitMeta = "a.b".split(".").length;
              boolean hierCaught = false;
              try {
                Integer.parseInt("not_num");
              } catch (IllegalArgumentException e) {
                hierCaught = true;
              }
              Map m = new HashMap();
              def compVal = m.computeIfAbsent(5, k -> k + 1);
              return shInt + "|" + shLong + "|" + satByte + "|" + ovf + "|" + exactCaught + "|" + q.toString() + "|" + bdScaleStrict + "|" + splitEsc + "|" + splitMeta + "|" + hierCaught + "|" + compVal;
  - match: { result: "1|4294967296|-1|-2147483648|true|0.125|true|3|0|true|6" }

