  - do:
      cluster.info: {}
  - is_true: ''

  - do:
      nodes.reload_secure_settings: {}
  - is_true: _nodes

  - do:
      nodes.get_repositories_metering_info: {}
  - is_true: _nodes

  - do:
      nodes.clear_repositories_metering_archive:
        max_archive_version: 1
