---
"Round 57 SQL, ES|QL, EQL, Stateful Snapshot/Mount/SLM, Synonyms, Inference, Connectors & Search Applications":
  # F2: SQL Engine DESCRIBE, SHOW COLUMNS/FUNCTIONS, aliases, GROUP BY/HAVING, columnar + ? params, and /_sql/translate
  - do:
      indices.create:
        index: r57_sql_idx
        body:
          mappings:
            properties:
              dept: { type: keyword }
              name: { type: keyword }
              age: { type: integer }
              salary: { type: double }
  - match: { acknowledged: true }

  - do:
      bulk:
        index: r57_sql_idx
        refresh: true
        body:
          - index: { _id: "1" }
          - { dept: "eng", name: "Alice", age: 30, salary: 120.0 }
          - index: { _id: "2" }
          - { dept: "eng", name: "Bob", age: 9, salary: 90.0 }
          - index: { _id: "3" }
