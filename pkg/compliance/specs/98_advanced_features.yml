  - do:
      sql.query:
        body:
          query: "SELECT host, latency FROM r55_adv_idx"
  - is_true: columns
  - is_true: rows

  - do:
      sql.translate:
        body:
          query: "SELECT * FROM r55_adv_idx WHERE latency > 10"
  - is_true: query

  - do:
      sql.clear_cursor:
        body:
          cursor: "r55_cursor_1"
  - match: { succeeded: true }

  - do:
      eql.search:
        index: r55_adv_idx
        body:
          query: "any where true"
  - is_true: hits

  - do:
      indices.reload_search_analyzers:
        index: r55_adv_idx
  - is_true: reload_details

  - do:
      indices.disk_usage:
        index: r55_adv_idx
  - is_true: _shards

  - do:
      indices.field_usage_stats:
        index: r55_adv_idx
  - is_true: _shards

  - do:
      ml.info: {}
  - is_true: ''

  - do:
      ml.get_memory_stats: {}
  - is_true: ''

  - do:
      ml.set_upgrade_mode:
        enabled: false
  - match: { acknowledged: true }

  - do:
      ml.put_job:
        job_id: r55_job
