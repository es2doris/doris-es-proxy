"Round 57 Runner Stash/Transforms, Security, Capabilities, Simulate Ingest, Scripts, Fleet, ML & Index Ops":
  # F1: Terminal _arbitrary_key_ key-name stashing + $obj.field expansion + nested transform_and_set (base64Encode(concat(...)), sha256, join)
  - do:
      nodes.info: {}
  - set: { nodes._arbitrary_key_: r57_node_id }
  - is_true: nodes.$r57_node_id.name

  - do:
      security.create_api_key:
        body:
          name: "r57-yaml-key"
          metadata:
            env: "dev"
  - set: { '': r57_key_obj }
  - transform_and_set:
      r57_basic_creds: "base64Encode(concat($r57_key_obj.id, ':', $r57_key_obj.api_key))"
      r57_name_sha: "sha256($r57_key_obj.name)"
      r57_joined_tags: "join(split('alpha|beta|gamma', '|'), ',')"

  # F0 & F8: Security API key update/bulk_update/query, user/role Query DSL, _privileges, cache clear, OIDC/SAML/PKI/SSL
  - do:
      security.put_api_key:
        id: $r57_key_obj.id
        body:
          metadata:
            env: "staging"
            tag_list: $r57_joined_tags
  - match: { updated: true }

  - do:
      security.bulk_update_api_keys:
        body:
          ids: [$r57_key_obj.id]
          metadata:
            env: "prod"
  - length: { updated: 1 }

  - do:
      security.query_api_keys:
        body:
          query:
            match:
              name: "r57-yaml-key"
  - gte: { total: 1 }

  - do:
      security.put_user:
        username: r57_yaml_user
        body:
          password: "secretPassword123"
          roles: ["admin"]
          email: "r57@example.com"
  - match: { user.created: true }

  - do:
      security.query_user:
        body:
          query:
            prefix:
              username: "r57_yaml"
  - gte: { total: 1 }

  - do:
      security.put_role:
        name: r57_yaml_role
        body:
          cluster: ["monitor"]
  - is_true: role

  - do:
      security.query_role:
        body:
          query:
            wildcard:
              name: "r57_yaml_*"
  - gte: { total: 1 }

  - do:
      security.get_user_privileges: {}
  - is_true: cluster

  - do:
      security.put_privileges:
        body:
          r57_app:
            reader:
              actions: ["data:read/*"]
  - is_true: r57_app

  - do:
      security.clear_cached_privileges:
        application: r57_app
  - is_true: _nodes

  - do:
      security.create_service_token:
        namespace: elastic
        service: fleet-server
        token_name: r57_svc_tok
  - is_true: token.value

  - do:
      security.clear_cached_service_tokens:
        namespace: elastic
        service: fleet-server
        token_name: r57_svc_tok
  - is_true: _nodes

  - do:
      security.oidc_prepare_authentication:
        body:
          realm: "oidc1"
  - set: { state: r57_oidc_state }
  - is_true: redirect

  - do:
      security.oidc_authenticate:
        body:
          redirect_uri: "https://app.example/cb?code=123"
          state: $r57_oidc_state
  - set: { access_token: r57_oidc_tok }
  - is_true: access_token

  - do:
      security.oidc_logout:
        body:
          token: $r57_oidc_tok
  - is_true: redirect

  - do:
      security.saml_prepare_authentication:
        body:
          realm: "saml1"
  - is_true: id

  - do:
      security.saml_authenticate:
        body:
          content: "PHNhbWw+..."
          ids: ["req1"]
  - set: { access_token: r57_saml_tok }

  - do:
      security.saml_invalidate:
        body:
          query_string: "SAMLRequest=xyz"
  - is_unset: error

  - do:
      security.saml_logout:
        body:
          token: $r57_saml_tok
  - is_unset: error

  - do:
      security.saml_complete_logout:
        body: {}
  - is_unset: error

  - do:
      security.saml_service_provider_metadata:
        body:
          realm_name: "saml1"
  - is_unset: error

  - do:
      security.delegate_pki:
        body:
          subject_dn: "CN=r57_pki_svc,OU=Eng"
  - match: { username: "r57_pki_svc" }

  - do:
      security.get_certificates: {}
  - is_unset: error

  # F0 & F9: Capabilities, Script Introspection, System Features Migration, End-to-End Simulate Ingest
  - do:
      capabilities: {}
  - is_true: capabilities

  - do:
      get_script_context: {}
  - is_true: contexts

  - do:
      get_script_languages: {}
  - is_true: language_contexts

  - do:
      migration.get_feature_upgrade_status: {}
  - is_true: features

  - do:
      migration.post_feature_upgrade:
        body:
          feature_name: "kibana"
  - match: { acknowledged: true }

  - do:
      ingest.put_pipeline:
        id: r57_sim_def_pipe
        body:
          processors:
            - set:
                field: "piped_env"
                value: "prod"
  - match: { acknowledged: true }

  - do:
      indices.put_index_template:
        name: r57_sim_tpl
        body:
          index_patterns: ["r57-sim-*"]
          template:
            settings:
              index.default_pipeline: "r57_sim_def_pipe"
            mappings:
              properties:
                host:
                  type: keyword
  - match: { acknowledged: true }

  - do:
      simulate.ingest:
        body:
          index: "r57-sim-logs-01"
          docs:
            - _source:
                host: "web-1"
                dyn_metric: 99
  - match: { pipeline_simulation.0.doc._source.piped_env: "prod" }
  - is_true: mapping_addition.properties.dyn_metric

  # F0 & F9: Fleet global_checkpoints & secrets, Index ops (_flush/synced, _freeze, _unfreeze), Rethrottle, Logstash HEAD, ML & CAT ML
  - do:
      indices.create:
        index: r57_ops_idx
  - match: { acknowledged: true }

  - do:
      fleet.global_checkpoints:
        index: r57_ops_idx
  - is_true: last_known_global_checkpoints

  - do:
      fleet.post_secret:
        body:
          value: "s3cr3t-value"
  - set: { id: r57_fsec_id }

  - do:
      fleet.get_secret:
        id: $r57_fsec_id
  - match: { id: $r57_fsec_id }

  - do:
      fleet.delete_secret:
        id: $r57_fsec_id
  - match: { acknowledged: true }

  - do:
      indices.flush_synced:
        index: r57_ops_idx
  - is_true: _shards

  - do:
      indices.freeze:
        index: r57_ops_idx
  - match: { acknowledged: true }

  - do:
      indices.unfreeze:
        index: r57_ops_idx
  - match: { acknowledged: true }

  - do:
      reindex_rethrottle:
        task_id: "nodeA:301"
        requests_per_second: 100
  - is_true: nodes

  - do:
      update_by_query_rethrottle:
        task_id: "nodeA:302"
        requests_per_second: 100
  - is_true: nodes

  - do:
      delete_by_query_rethrottle:
        task_id: "nodeA:303"
        requests_per_second: -1
  - is_true: nodes

  - do:
      logstash.put_pipeline:
        id: r57_ls_pipe
        body:
          pipeline: "input { stdin {} }"
          description: "r57 test"
  - is_true: ''

  - do:
      logstash.exists_pipeline:
        id: r57_ls_pipe

  - do:
      ml.find_file_structure:
        body: "a,b\n1,2\n3,4\n"
  - is_true: format

  - do:
      ml.put_trained_model:
        model_id: r57_ml_model
        body:
          input:
            field_names: ["text"]
  - match: { model_id: "r57_ml_model" }

  - do:
      ml.put_trained_model_vocabulary:
        model_id: r57_ml_model
        body:
          vocabulary: ["hello", "world"]
  - is_true: ''

  - do:
      ml.get_trained_model_vocabulary:
        model_id: r57_ml_model
  - length: { vocabulary: 2 }

  - do:
      ml.start_trained_model_deployment:
        model_id: r57_ml_model
  - is_true: assignment

  - do:
      ml.clear_trained_model_deployment_cache:
        model_id: r57_ml_model
  - match: { acknowledged: true }

  - do:
      ml.stop_trained_model_deployment:
        model_id: r57_ml_model
  - match: { stopped: true }

  - do:
      ml.put_job:
        job_id: r57_ml_job
        body:
          analysis_config:
            bucket_span: "15m"
            detectors:
              - function: "count"
          data_description:
            time_field: "@timestamp"
  - match: { job_id: "r57_ml_job" }

  - do:
      ml.open_job:
        job_id: r57_ml_job
  - match: { opened: true }

  - do:
      ml.post_data:
        job_id: r57_ml_job
        body:
          - "@timestamp": 1700000000000
  - is_true: ''

  - do:
      ml.close_job:
        job_id: r57_ml_job
  - match: { closed: true }

  - do:
      ml.upgrade_job_snapshot:
        job_id: r57_ml_job
        snapshot_id: "1"
  - match: { acknowledged: true }

  - do:
      ml.get_model_snapshot_upgrade_stats:
        job_id: r57_ml_job
        snapshot_id: "1"
  - is_true: ''

  - do:
      ml.delete_expired_data:
        job_id: "_all"
  - is_true: ''

  - do:
      cat.anomaly_detectors: {}
  - is_unset: error

  - do:
      cat.datafeeds: {}
  - is_unset: error

  - do:
      cat.trained_models: {}
  - is_unset: error

  - do:
      cat.data_frame_analytics: {}
