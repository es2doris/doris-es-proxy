---
"Ping headers transform_and_set and non-skipped skip":
  - skip:
      version: " - 6.99.99"
      reason: "only skipped prior to 7.0"
      features: [headers, contains, transform_and_set, regex]
  - do:
      ping: {}
  - is_true: ''

  - do:
      info: {}
  - match:
      $headers.content-type: "/^application\\/json/"
  - transform_and_set:
      ver_b64: "base64Encode(version.number)"
      flavor_upper: "upper(version.build_flavor)"
      flavor_lower: "lower(version.build_flavor)"
  - match:
      version.number: "7.10.2"

---
"Version skipped section":
  - skip:
      version: "7.0.0 - 7.99.99"
      reason: "intentionally skipped on 7.x to verify version range skip"
  - do:
      info: {}

---
"Contains assertion with recursive regex and clone and search_shards":
  - do:
      indices.create:
        index: r47_src_idx
  - do:
      index:
        index: r47_src_idx
        id: "1"
        body: { "tag": "alpha_item", "score_num": 10 }
  - do:
      index:
        index: r47_src_idx
        id: "2"
        body: { "tag": "beta_item", "score_num": 20 }
  - do:
      indices.refresh:
        index: r47_src_idx
  - do:
      search:
        index: r47_src_idx
        body:
          query:
            match_all: {}
  - contains:
      hits.hits:
        _id: "1"
        _source:
          tag: "/^alpha_/"
  - contains:
      hits.hits:
        _id: "2"
        _source:
          tag: "/^beta_/"

  - do:
      indices.clone:
        index: r47_src_idx
        target: r47_cloned_idx
  - match: { acknowledged: true }

  - do:
      search_shards:
        index: r47_cloned_idx
  - is_true: shards

---
"ILM lifecycle policy CRUD":
  - do:
      ilm.put_lifecycle:
        policy: r47_ilm_policy
        body:
          policy:
            phases:
              hot:
                actions:
                  rollover:
                    max_age: "30d"
  - match: { acknowledged: true }

  - do:
      ilm.get_lifecycle:
        policy: r47_ilm_policy
  - is_true: r47_ilm_policy

  - do:
      ilm.delete_lifecycle:
        policy: r47_ilm_policy
  - match: { acknowledged: true }

---
"Enrich policy CRUD and execute":
  - do:
      indices.create:
        index: r47_enrich_src
  - do:
      enrich.put_policy:
        name: r47_enrich_pol
        body:
          match:
            indices: r47_enrich_src
            match_field: k
            enrich_fields: ["v"]
  - match: { acknowledged: true }

  - do:
      enrich.get_policy:
        name: r47_enrich_pol
  - is_true: policies

  - do:
      enrich.execute_policy:
        name: r47_enrich_pol
  - is_true: status

  - do:
      enrich.delete_policy:
        name: r47_enrich_pol
  - match: { acknowledged: true }

---
"Data stream lifecycle":
  - do:
      indices.create_data_stream:
        name: r47_ds
  - match: { acknowledged: true }

  - do:
      indices.get_data_stream:
        name: r47_ds
  - is_true: data_streams

  - do:
      indices.delete_data_stream:
        name: r47_ds
  - match: { acknowledged: true }

---
"Round 52 Index blocks SLM Watcher Transform Dangling Autoscaling and Data Stream lifecycle":
  - do:
      indices.create:
        index: r52_comp_blk
  - do:
      index:
        index: r52_comp_blk
        id: "1"
        body: { "title": "doc1" }
  - do:
      indices.add_block:
        index: r52_comp_blk
        block: write
  - match: { acknowledged: true }
  - do:
      catch: forbidden
      index:
        index: r52_comp_blk
        id: "2"
        body: { "title": "blocked" }
  - do:
      indices.put_settings:
        index: r52_comp_blk
        body:
          index:
            blocks:
              write: false
  - match: { acknowledged: true }

  - do:
      snapshot.create_repository:
        repository: r52_comp_repo
        body:
          type: fs
  - do:
      slm.put_lifecycle:
        policy_id: r52_comp_slm
        body:
          schedule: "0 30 1 * * ?"
          name: "<r52-snap-{now/d}>"
          repository: r52_comp_repo
  - match: { acknowledged: true }
  - do:
      slm.execute_lifecycle:
        policy_id: r52_comp_slm
  - is_true: snapshot_name
  - do:
      slm.get_status: {}
  - match: { operation_mode: "RUNNING" }
  - do:
      slm.delete_lifecycle:
        policy_id: r52_comp_slm
  - match: { acknowledged: true }

  - do:
      watcher.put_watch:
        id: r52_comp_watch
        body:
          trigger: { schedule: { interval: "10m" } }
          input: { simple: {} }
          actions: { log: { logging: { text: "alert" } } }
  - is_true: _id
  - do:
      watcher.execute_watch:
        id: r52_comp_watch
  - is_true: watch_record
  - do:
      watcher.delete_watch:
        id: r52_comp_watch
  - match: { found: true }

  - do:
      transform.put_transform:
        transform_id: r52_comp_tf
        body:
          source: { index: ["r52_comp_blk"] }
          dest: { index: "r52_comp_tf_dest" }
          pivot:
            group_by: { title: { terms: { field: "title" } } }
            aggregations: { cnt: { value_count: { field: "title" } } }
  - match: { acknowledged: true }
  - do:
      transform.start_transform:
        transform_id: r52_comp_tf
  - match: { acknowledged: true }
  - do:
      transform.stop_transform:
        transform_id: r52_comp_tf
  - match: { acknowledged: true }
  - do:
      transform.delete_transform:
        transform_id: r52_comp_tf
  - match: { acknowledged: true }

  - do:
      dangling_indices.list_dangling_indices: {}
  - is_true: _nodes
  - do:
      autoscaling.put_autoscaling_policy:
        name: r52_comp_auto
        body:
          roles: ["data_hot"]
          deciders: { fixed: {} }
  - match: { acknowledged: true }
  - do:
      autoscaling.get_autoscaling_capacity: {}
  - is_true: policies
  - do:
      autoscaling.delete_autoscaling_policy:
        name: r52_comp_auto
  - match: { acknowledged: true }

  - do:
      indices.create_data_stream:
        name: r52_comp_ds
  - do:
      catch: bad_request
      index:
        index: r52_comp_ds
        id: "1"
        body: { "@timestamp": "2026-01-01T00:00:00Z" }
  - do:
      indices.promote_data_stream:
        name: r52_comp_ds
  - match: { acknowledged: true }
  - do:
      indices.delete_data_stream:
        name: r52_comp_ds
  - match: { acknowledged: true }
