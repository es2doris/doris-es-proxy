            bucket_span: "15m"
            detectors:
              - function: "count"
          data_description:
            time_field: "@timestamp"
  - match: { job_id: "r55_job" }

  - do:
      ml.open_job:
        job_id: r55_job
  - match: { opened: true }

  - do:
      ml.get_jobs:
        job_id: r55_job
  - is_true: jobs

  - do:
      ml.get_job_stats:
        job_id: r55_job
  - is_true: jobs

  - do:
      cat.ml_anomaly_detectors:
        job_id: r55_job
        format: json
  - is_true: ''

  - do:
      ml.close_job:
        job_id: r55_job
  - match: { closed: true }

  - do:
      ml.delete_job:
        job_id: r55_job
  - match: { acknowledged: true }

  - do:
      ml.put_calendar:
        calendar_id: r55_cal
        body:
          description: "Maintenance window"
  - match: { calendar_id: "r55_cal" }

  - do:
      ml.delete_calendar:
        calendar_id: r55_cal
  - match: { acknowledged: true }

  - do:
      ml.put_filter:
        filter_id: r55_flt
        body:
          description: "Allowed hosts"
          items: ["web-01"]
  - match: { filter_id: "r55_flt" }

  - do:
      ml.delete_filter:
        filter_id: r55_flt
  - match: { acknowledged: true }

  - do:
      security.put_role_mapping:
        name: r55_rm
        body:
          roles: ["superuser"]
          enabled: true
          rules:
            field:
              username: "*"
  - is_true: role_mapping

  - do:
      security.get_role_mapping:
        name: r55_rm
  - is_true: r55_rm

  - do:
      security.delete_role_mapping:
        name: r55_rm
  - match: { found: true }

  - do:
      security.get_builtin_privileges: {}
  - is_true: cluster

  - do:
      security.clear_cached_roles:
        name: superuser
  - is_true: _nodes

  - do:
      security.clear_cached_realms:
        realms: "native1"
        username: elastic
  - is_true: _nodes

  - do:
      security.enroll_kibana: {}
  - is_true: ''

  - do:
      security.enroll_node: {}
  - is_true: ''

  - do:
      fleet.search:
        index: r55_adv_idx
        body:
          query:
            match_all: {}
  - is_true: hits

  - do:
      fleet.global_checkpoints:
        index: r55_adv_idx
  - is_true: ''

  - do:
      graph.explore:
        index: r55_adv_idx
        body:
          query:
