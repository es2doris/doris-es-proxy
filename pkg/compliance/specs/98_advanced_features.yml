---
"Ping headers transform_and_set and non-skipped skip":
  - skip:
      version: " - 6.99.99"
      reason: "only skipped prior to 7.0"
      features: [headers, contains, transform_and_set, regex]
  - do:
      ping: {}
  - is_true: ''

  - do:
      info: {}
  - match:
      $headers.content-type: "/^application\\/json/"
  - transform_and_set:
      ver_b64: "base64Encode(version.number)"
      flavor_upper: "upper(version.build_flavor)"
      flavor_lower: "lower(version.build_flavor)"
  - match:
      version.number: "7.10.2"

---
"Version skipped section":
  - skip:
      version: "7.0.0 - 7.99.99"
      reason: "intentionally skipped on 7.x to verify version range skip"
  - do:
      info: {}

---
"Contains assertion with recursive regex and clone and search_shards":
  - do:
      indices.create:
        index: r47_src_idx
  - do:
      index:
        index: r47_src_idx
        id: "1"
        body: { "tag": "alpha_item", "score_num": 10 }
  - do:
      index:
        index: r47_src_idx
        id: "2"
        body: { "tag": "beta_item", "score_num": 20 }
  - do:
      indices.refresh:
        index: r47_src_idx
  - do:
      search:
        index: r47_src_idx
        body:
          query:
            match_all: {}
  - contains:
      hits.hits:
        _id: "1"
        _source:
          tag: "/^alpha_/"
  - contains:
      hits.hits:
        _id: "2"
        _source:
          tag: "/^beta_/"

  - do:
      indices.clone:
        index: r47_src_idx
        target: r47_cloned_idx
  - match: { acknowledged: true }

  - do:
      search_shards:
        index: r47_cloned_idx
  - is_true: shards

---
"ILM lifecycle policy CRUD":
  - do:
      ilm.put_lifecycle:
        policy: r47_ilm_policy
        body:
          policy:
            phases:
              hot:
                actions:
                  rollover:
                    max_age: "30d"
  - match: { acknowledged: true }

  - do:
      ilm.get_lifecycle:
        policy: r47_ilm_policy
  - is_true: r47_ilm_policy

  - do:
      ilm.delete_lifecycle:
        policy: r47_ilm_policy
  - match: { acknowledged: true }

---
"Enrich policy CRUD and execute":
  - do:
      indices.create:
        index: r47_enrich_src
  - do:
      enrich.put_policy:
        name: r47_enrich_pol
        body:
          match:
            indices: r47_enrich_src
            match_field: k
            enrich_fields: ["v"]
  - match: { acknowledged: true }

  - do:
      enrich.get_policy:
        name: r47_enrich_pol
  - is_true: policies

  - do:
      enrich.execute_policy:
        name: r47_enrich_pol
  - is_true: status

  - do:
      enrich.delete_policy:
        name: r47_enrich_pol
  - match: { acknowledged: true }

---
"Data stream lifecycle":
  - do:
      indices.create_data_stream:
        name: r47_ds
  - match: { acknowledged: true }

  - do:
      indices.get_data_stream:
        name: r47_ds
  - is_true: data_streams

  - do:
      indices.delete_data_stream:
        name: r47_ds
  - match: { acknowledged: true }

---
"Round 52 Index blocks SLM Watcher Transform Dangling Autoscaling and Data Stream lifecycle":
  - do:
      indices.create:
        index: r52_comp_blk
  - do:
      index:
        index: r52_comp_blk
        id: "1"
        body: { "title": "doc1" }
  - do:
      indices.add_block:
        index: r52_comp_blk
        block: write
  - match: { acknowledged: true }
  - do:
      catch: forbidden
      index:
        index: r52_comp_blk
        id: "2"
        body: { "title": "blocked" }
  - do:
      indices.put_settings:
        index: r52_comp_blk
        body:
          index:
            blocks:
              write: false
  - match: { acknowledged: true }

  - do:
      snapshot.create_repository:
        repository: r52_comp_repo
        body:
          type: fs
  - do:
      slm.put_lifecycle:
        policy_id: r52_comp_slm
        body:
          schedule: "0 30 1 * * ?"
          name: "<r52-snap-{now/d}>"
          repository: r52_comp_repo
  - match: { acknowledged: true }
  - do:
      slm.execute_lifecycle:
        policy_id: r52_comp_slm
  - is_true: snapshot_name
  - do:
      slm.get_status: {}
  - match: { operation_mode: "RUNNING" }
  - do:
      slm.delete_lifecycle:
        policy_id: r52_comp_slm
  - match: { acknowledged: true }

  - do:
      watcher.put_watch:
        id: r52_comp_watch
        body:
          trigger: { schedule: { interval: "10m" } }
          input: { simple: {} }
          actions: { log: { logging: { text: "alert" } } }
  - is_true: _id
  - do:
      watcher.execute_watch:
        id: r52_comp_watch
  - is_true: watch_record
  - do:
      watcher.delete_watch:
        id: r52_comp_watch
  - match: { found: true }

  - do:
      transform.put_transform:
        transform_id: r52_comp_tf
        body:
          source: { index: ["r52_comp_blk"] }
          dest: { index: "r52_comp_tf_dest" }
          pivot:
            group_by: { title: { terms: { field: "title" } } }
            aggregations: { cnt: { value_count: { field: "title" } } }
  - match: { acknowledged: true }
  - do:
      transform.start_transform:
        transform_id: r52_comp_tf
  - match: { acknowledged: true }
  - do:
      transform.stop_transform:
        transform_id: r52_comp_tf
  - match: { acknowledged: true }
  - do:
      transform.delete_transform:
        transform_id: r52_comp_tf
  - match: { acknowledged: true }

  - do:
      dangling_indices.list_dangling_indices: {}
  - is_true: _nodes
  - do:
      autoscaling.put_autoscaling_policy:
        name: r52_comp_auto
        body:
          roles: ["data_hot"]
          deciders: { fixed: {} }
  - match: { acknowledged: true }
  - do:
      autoscaling.get_autoscaling_capacity: {}
  - is_true: policies
  - do:
      autoscaling.delete_autoscaling_policy:
        name: r52_comp_auto
  - match: { acknowledged: true }

  - do:
      indices.create_data_stream:
        name: r52_comp_ds
  - do:
      catch: bad_request
      index:
        index: r52_comp_ds
        id: "1"
        body: { "@timestamp": "2026-01-01T00:00:00Z" }
  - do:
      indices.promote_data_stream:
        name: r52_comp_ds
  - match: { acknowledged: true }
  - do:
      indices.delete_data_stream:
        name: r52_comp_ds
  - match: { acknowledged: true }

---
"Round 53 Synonyms, Query Rules, Features, Rollup, CCR, Security, and Logstash APIs":
  - do:
      synonyms.put_synonym:
        id: r53_syn_set
        body:
          synonyms_set:
            - id: "r1"
              synonyms: "laptop, notebook"
  - match: { result: "created" }
  - do:
      synonyms.get_synonym:
        id: r53_syn_set
  - match: { count: 1 }
  - do:
      synonyms.delete_synonym:
        id: r53_syn_set
  - match: { acknowledged: true }

  - do:
      query_rules.put_ruleset:
        ruleset_id: r53_qr_set
        body:
          rules:
            - rule_id: "r1"
              type: "pinned"
              criteria:
                - type: "contains"
                  metadata: "query_str"
                  values: ["pug"]
              actions:
                ids: ["1"]
  - match: { result: "created" }
  - do:
      query_rules.test:
        ruleset_id: r53_qr_set
        body:
          match_criteria:
            query_str: "cute pugs"
  - length: { matched_rules: 1 }
  - do:
      query_rules.delete_ruleset:
        ruleset_id: r53_qr_set
  - match: { acknowledged: true }

  - do:
      features.get_features: {}
  - is_true: features
  - do:
      features.reset_features: {}
  - is_true: features

  - do:
      migration.deprecations: {}
  - match: { cluster_settings: [] }

  - do:
      rollup.put_job:
        id: r53_rollup_job
        body:
          index_pattern: "r53_*"
          rollup_index: "r53_rollup_idx"
          cron: "0 * * * * ?"
          page_size: 100
          groups:
            date_histogram:
              field: "@timestamp"
              fixed_interval: "1h"
  - match: { acknowledged: true }
  - do:
      rollup.start_job:
        id: r53_rollup_job
  - match: { started: true }
  - do:
      rollup.stop_job:
        id: r53_rollup_job
  - match: { stopped: true }
  - do:
      rollup.delete_job:
        id: r53_rollup_job
  - match: { acknowledged: true }

  - do:
      ccr.put_auto_follow_pattern:
        name: r53_af
        body:
          remote_cluster: "rc1"
          leader_index_patterns: ["leader_*"]
  - match: { acknowledged: true }
  - do:
      ccr.delete_auto_follow_pattern:
        name: r53_af
  - match: { acknowledged: true }

  - do:
      security.put_user:
        username: r53_user
        body:
          password: "secretpassword"
          roles: ["admin"]
  - match: { user.created: true }
  - do:
      security.delete_user:
        username: r53_user
  - match: { found: true }

  - do:
      logstash.put_pipeline:
        id: r53_ls_pipe
        body:
          pipeline: "input { stdin {} } output { stdout {} }"
  - match: { acknowledged: true }
  - do:
      logstash.get_pipeline:
        id: r53_ls_pipe
  - is_true: r53_ls_pipe
  - do:
      logstash.delete_pipeline:
        id: r53_ls_pipe
  - match: { acknowledged: true }

---
"Round 54 inference, connector, search_application, text_structure, profiling, async_search, esql, watcher, and license APIs":
  - do:
      node_selector:
        attribute: "data"
      inference.put:
        task_type: text_embedding
        inference_id: r54_embed
        body:
          service: "elasticsearch"
          service_settings:
            model_id: ".elser_model_2"
  - match: { inference_id: "r54_embed" }
  - match: { task_type: "text_embedding" }

  - do:
      inference.get:
        inference_id: r54_embed
  - match: { endpoints.0.inference_id: "r54_embed" }
  - match: { $body.endpoints.-1.service: "elasticsearch" }

  - do:
      inference.inference:
        task_type: text_embedding
        inference_id: r54_embed
        body:
          input: ["hello world", "doris proxy"]
  - match: { inference_id: "r54_embed" }
  - is_true: text_embedding.0.embedding

  - do:
      inference.delete:
        inference_id: r54_embed
  - match: { acknowledged: true }

  - do:
      connector.put:
        connector_id: r54_conn
        body:
          name: "My S3 Connector"
          service_type: "s3"
          index_name: "search-s3"
  - match: { acknowledged: true }

  - do:
      connector.update_status:
        connector_id: r54_conn
        body:
          status: "connected"
  - match: { acknowledged: true }

  - do:
      connector.get:
        connector_id: r54_conn
  - match: { id: "r54_conn" }
  - match: { status: "connected" }

  - do:
      connector.sync_job_post:
        body:
          id: "r54_job_1"
          connector_id: "r54_conn"
          job_type: "full"
  - match: { id: "r54_job_1" }

  - do:
      connector.sync_job_check_in:
        connector_sync_job_id: "r54_job_1"
  - match: { acknowledged: true }

  - do:
      connector.sync_job_cancel:
        connector_sync_job_id: "r54_job_1"
  - match: { acknowledged: true }

  - do:
      connector.sync_job_delete:
        connector_sync_job_id: "r54_job_1"
  - match: { acknowledged: true }

  - do:
      connector.delete:
        connector_id: r54_conn
  - match: { acknowledged: true }

  - do:
      search_application.put:
        name: r54_app
        body:
          indices: ["idx_advanced"]
          template:
            script:
              source: '{"query":{"match":{"title":"{{query_string}}"}}}'
              params:
                query_string: "default"
  - match: { acknowledged: true }

  - do:
      search_application.render_query:
        name: r54_app
        body:
          params:
            query_string: "hello"
  - match: { query.match.title: "hello" }

  - do:
      search_application.delete:
        name: r54_app
  - match: { acknowledged: true }

  - do:
      behavioral_analytics.put_collection:
        collection_name: r54_analytics
  - match: { acknowledged: true }

  - do:
      behavioral_analytics.post_event:
        collection_name: r54_analytics
        event_type: page_view
        body:
          page:
            url: "https://example.com"
  - match: { ok: true }

  - do:
      behavioral_analytics.delete_collection:
        collection_name: r54_analytics
  - match: { acknowledged: true }

  - do:
      text_structure.find_structure:
        body:
          lines:
            - '{"host":"web01","status":200}'
            - '{"host":"web02","status":404}'
  - match: { format: "ndjson" }
  - is_true: mappings.properties.host

  - do:
      text_structure.test_grok_pattern:
        body:
          grok_pattern: "%{WORD:verb} %{INT:code:int}"
          messages:
            - "GET 200"
  - match: { matches.0.matched: true }
  - match: { matches.0.captures.verb: "GET" }
  - match: { matches.0.captures.code: 200 }

  - do:
      profiling.status: {}
  - match: { status: "ok" }
  - match: { enabled: true }

  - do:
      profiling.flamegraph:
        body: {}
  - is_true: flamegraph

  - do:
      esql.query:
        body:
          query: 'ROW a = 42, b = "hello" | EVAL c = 99 | KEEP a, b, c'
  - match: { columns.0.name: "a" }
  - match: { values.0.0: 42 }
  - match: { values.0.-1: 99 }

  - do:
      watcher.update_settings:
        body:
          xpack.watcher.encrypt_sensitive_data: true
  - match: { acknowledged: true }

  - do:
      watcher.get_settings: {}
  - match: { acknowledged: true }

  - do:
      watcher.query_watches:
        body: {}
  - is_true: hits

  - do:
      license.get: {}
  - match: { license.status: "active" }

  - do:
      license.get_basic_status: {}
  - match: { eligible_to_start_basic: true }

  - do:
      license.get_trial_status: {}
  - match: { eligible_to_start_trial: true }

  - do:
      xpack.info: {}
  - match: { tagline: "You Know, for X" }

  - do:
      xpack.usage: {}
  - match: { watcher.available: true }

  - do:
      ssl.certificates: {}
  - match: { 0.alias: "http" }

---
"Round 55 health_report, sql, eql, ml, security, fleet, graph, cat, cluster, nodes, and F1 runner operators":
  - do:
      info: {}
  - gt: { version.number: "7.0.0" }
  - lt: { version.number: "9.0.0" }
  - gt: { version.build_date: "2020-01-01T00:00:00Z" }
  - not_contains: { tagline: "NotElasticsearch" }
  - is_empty: nonexistent_optional_field
  - transform_and_set:
      ver_parts: 'split(version.number, ".")'
      ver_joined: 'concat(version.number, "-", version.build_flavor)'
      ver_underscored: 'replace(version.number, ".", "_")'
      major_int: 'toInt($ver_parts.0)'
      major_str: 'toString($major_int)'
  - match: { version.number: "7.10.2" }

  - do:
      health_report: {}
  - match: { status: "green" }
  - is_true: indicators.shards_availability

  - do:
      health_report:
        indicator: shards_availability
  - is_true: status

  - do:
      indices.create:
        index: r55_adv_idx
        body:
          mappings:
            properties:
              host: { type: keyword }
              latency: { type: integer }
              "@timestamp": { type: date }
  - do:
