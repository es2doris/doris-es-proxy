---
"Cat endpoints and cluster tasks admin":
  - do:
      indices.create:
        index: "admin_spec_idx"
  - match: { acknowledged: true }

  - do:
      cat.allocation:
        format: "json"
  - is_true: ""

  - do:
      cat.fielddata:
        format: "json"
  - match: { "": [] }

  - do:
      cat.master:
        format: "json"
  - length: { $body: 1 }

  - do:
      cat.nodeattrs:
        format: "json"
  - is_true: ""

  - do:
      cat.pending_tasks:
        format: "json"
  - match: { "": [] }

  - do:
      cat.plugins:
        format: "json"
  - match: { "": [] }

  - do:
      cat.recovery:
        format: "json"
  - is_true: ""

  - do:
      cat.repositories:
        format: "json"
  - is_unset: error

  - do:
      cat.segments:
        format: "json"
  - is_true: ""

  - do:
      cat.tasks:
        format: "json"
  - is_unset: error

  - do:
      cat.thread_pool:
        format: "json"
  - is_true: ""

  - do:
      cat.templates:
        format: "json"
  - is_unset: error

  - do:
      tasks.list: {}
  - is_true: nodes

  - do:
      tasks.get:
        task_id: "node-1:1"
  - match: { completed: true }
  - match: { task.node: "node-1" }

  - do:
      tasks.cancel:
        task_id: "node-1:1"
  - match: { nodes: {} }

  - do:
      cluster.allocation_explain: {}
  - is_true: index
  - is_true: current_state

  - do:
      cluster.pending_tasks: {}
  - match: { tasks: [] }

  - do:
      cluster.reroute: {}
  - match: { acknowledged: true }

  - do:
      cluster.remote_info: {}
  - is_unset: error

  - do:
      nodes.usage: {}
  - is_true: nodes

  - do:
      nodes.hot_threads: {}
  - is_true: ""

  - do:
      nodes.reload_secure_settings: {}
  - match: { _nodes.failed: 0 }

  - do:
      indices.recovery:
        index: "admin_spec_idx"
  - is_true: admin_spec_idx.shards

  - do:
      indices.segments:
        index: "admin_spec_idx"
  - is_true: indices.admin_spec_idx.shards

  - do:
      indices.shard_stores:
        index: "admin_spec_idx"
  - match: { indices: {} }

  - do:
      indices.clear_cache:
        index: "admin_spec_idx"
  - match: { _shards.failed: 0 }

  - do:
      indices.close:
        index: "admin_spec_idx"
  - match: { acknowledged: true }

  - do:
      catch: bad_request
      search:
        index: "admin_spec_idx"

  - do:
      indices.open:
        index: "admin_spec_idx"
  - match: { acknowledged: true }

---
"Data streams stats, index template simulation, kNN search, and snapshot lifecycle":
  - do:
      indices.create_data_stream:
        name: "ds_admin_logs"
  - match: { acknowledged: true }

  - do:
      cat.data_streams:
        name: "ds_admin_logs"
        format: "json"
  - length: { $body: 1 }
  - match: { 0.name: "ds_admin_logs" }
  - match: { 0.status: "GREEN" }

  - do:
      indices.data_stream_stats:
        name: "ds_admin_logs"
  - match: { data_stream_count: 1 }
  - match: { data_streams.0.data_stream: "ds_admin_logs" }

  - do:
      cluster.put_component_template:
        name: "ct_sim_base"
        body:
          template:
            settings:
              number_of_shards: 1
            mappings:
              properties:
                host:
                  type: "keyword"
  - match: { acknowledged: true }

  - do:
      indices.put_index_template:
        name: "it_sim_logs"
        body:
          index_patterns: ["sim-logs-*"]
          composed_of: ["ct_sim_base"]
          priority: 100
          template:
            mappings:
              properties:
                message:
                  type: "text"
  - match: { acknowledged: true }

  - do:
      indices.simulate_template:
        name: "it_sim_logs"
  - match: { template.mappings.properties.host.type: "keyword" }
  - match: { template.mappings.properties.message.type: "text" }

  - do:
      indices.simulate_index_template:
        name: "sim-logs-2026"
  - match: { template.mappings.properties.host.type: "keyword" }
  - match: { template.mappings.properties.message.type: "text" }

  - do:
      indices.create:
        index: "knn_spec_idx"
        body:
          mappings:
            properties:
              vec:
                type: "dense_vector"
                dims: 3
              tag:
                type: "keyword"
  - match: { acknowledged: true }

  - do:
      index:
        index: "knn_spec_idx"
        id: "k1"
        refresh: true
        body:
          vec: [1.0, 0.0, 0.0]
          tag: "a"

  - do:
      index:
        index: "knn_spec_idx"
        id: "k2"
        refresh: true
        body:
          vec: [0.0, 1.0, 0.0]
          tag: "b"

  - do:
      knn_search:
        index: "knn_spec_idx"
        body:
          knn:
            field: "vec"
            query_vector: [1.0, 0.0, 0.0]
            k: 1
            num_candidates: 2
          filter:
            term:
              tag: "a"
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "k1" }

  - do:
      snapshot.put_repository:
        repository: "repo_spec_fs"
        body:
          type: "fs"
          settings:
            location: "/tmp/repo_spec_fs"
  - match: { acknowledged: true }

  - do:
      snapshot.get_repository:
        repository: "repo_spec_fs"
  - match: { repo_spec_fs.type: "fs" }

  - do:
      snapshot.verify_repository:
        repository: "repo_spec_fs"
  - is_true: nodes

  - do:
      snapshot.create:
        repository: "repo_spec_fs"
        snapshot: "snap_1"
        body:
          indices: "admin_spec_idx"
  - match: { accepted: true }
  - match: { snapshot.snapshot: "snap_1" }
  - match: { snapshot.state: "SUCCESS" }

  - do:
      snapshot.get:
        repository: "repo_spec_fs"
        snapshot: "snap_1"
  - length: { snapshots: 1 }
  - match: { snapshots.0.snapshot: "snap_1" }

  - do:
      snapshot.status:
        repository: "repo_spec_fs"
        snapshot: "snap_1"
  - length: { snapshots: 1 }
  - match: { snapshots.0.state: "SUCCESS" }

  - do:
      cat.snapshots:
        repository: "repo_spec_fs"
        format: "json"
  - length: { $body: 1 }
  - match: { 0.id: "snap_1" }

  - do:
      snapshot.restore:
        repository: "repo_spec_fs"
        snapshot: "snap_1"
  - match: { accepted: true }

  - do:
      snapshot.delete:
        repository: "repo_spec_fs"
        snapshot: "snap_1"
  - match: { acknowledged: true }

  - do:
      snapshot.delete_repository:
        repository: "repo_spec_fs"
  - match: { acknowledged: true }

---
"Data stream migration ILM lifecycle status and cat templates version":
  - do:
      indices.create:
        index: "mig_backing_000001"
  - match: { acknowledged: true }

  - do:
      indices.update_aliases:
        body:
          actions:
            - add:
                index: "mig_backing_000001"
                alias: "mig_logs_stream"
                is_write_index: true
  - match: { acknowledged: true }

  - do:
      indices.migrate_to_data_stream:
        name: "mig_logs_stream"
  - match: { acknowledged: true }

  - do:
      indices.get_data_stream:
        name: "mig_logs_stream"
  - length: { data_streams: 1 }
  - match: { data_streams.0.name: "mig_logs_stream" }

  - do:
      catch: missing
      indices.get_data_stream:
        name: "non_existent_data_stream_xyz"

  - do:
      ilm.get_status: {}
  - match: { operation_mode: "RUNNING" }

  - do:
      ilm.stop: {}
  - match: { acknowledged: true }

  - do:
      ilm.get_status: {}
  - match: { operation_mode: "STOPPED" }

  - do:
      ilm.start: {}
  - match: { acknowledged: true }

  - do:
      ilm.get_status: {}
  - match: { operation_mode: "RUNNING" }

  - do:
      ilm.move_to_step:
        index: "mig_backing_000001"
        body:
          current_step:
            phase: "new"
            action: "complete"
            name: "complete"
          next_step:
            phase: "hot"
            action: "complete"
            name: "complete"
  - match: { acknowledged: true }

  - do:
      ilm.remove_policy:
        index: "mig_backing_000001"
  - match: { has_failures: false }

  - do:
      ilm.retry:
        index: "mig_backing_000001"
  - match: { acknowledged: true }

  - do:
      catch: missing
      ilm.explain_lifecycle:
        index: "no_such_ilm_index_xyz"

  - do:
      indices.put_index_template:
        name: "it_cat_ver_spec"
        body:
          index_patterns: ["ver-spec-*"]
          version: 7
          template:
            mappings:
              properties:
                host:
                  type: "keyword"
  - match: { acknowledged: true }

  - do:
      cat.templates:
        name: "it_cat_ver_spec"
        format: "json"
  - length: { $body: 1 }
  - match: { 0.name: "it_cat_ver_spec" }
  - match: { 0.version: "7" }

  - do:
      catch: bad_request
      tasks.get:
        task_id: "malformed_task_id"

  - do:
      catch: missing
      cluster.allocation_explain:
        body:
          index: "no_such_alloc_idx_xyz"
          shard: 0
          primary: true
