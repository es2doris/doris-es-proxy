---
"Ingest pipeline put get and delete lifecycle":
  - do:
      ingest.put_pipeline:
        id: comp_pipe_lifecycle
        body:
          description: "Compliance lifecycle pipeline"
          processors:
            - set:
                field: "processed"
                value: true
  - is_true: acknowledged
  - do:
      ingest.get_pipeline:
        id: comp_pipe_lifecycle
  - match: { comp_pipe_lifecycle.description: "Compliance lifecycle pipeline" }
  - do:
      ingest.delete_pipeline:
        id: comp_pipe_lifecycle
  - is_true: acknowledged

---
"Simulate string processors set lowercase uppercase trim split join and gsub":
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - trim:
                  field: "raw_name"
              - lowercase:
                  field: "raw_name"
                  target_field: "lower_name"
              - uppercase:
                  field: "raw_name"
                  target_field: "upper_name"
              - gsub:
                  field: "path"
                  pattern: "/"
                  replacement: "."
              - split:
                  field: "csv_tags"
                  separator: ","
              - join:
                  field: "csv_tags"
                  separator: "|"
                  target_field: "pipe_tags"
              - set:
                  field: "ingested_by"
                  value: "doris-es-proxy"
          docs:
            - _source:
                raw_name: "  Alice_Admin  "
                path: "org/team/service"
                csv_tags: "alpha,beta,gamma"
  - length: { docs: 1 }
  - match: { docs.0.doc._source.raw_name: "Alice_Admin" }
  - match: { docs.0.doc._source.lower_name: "alice_admin" }
  - match: { docs.0.doc._source.upper_name: "ALICE_ADMIN" }
  - match: { docs.0.doc._source.path: "org.team.service" }
  - match: { docs.0.doc._source.pipe_tags: "alpha|beta|gamma" }
  - match: { docs.0.doc._source.ingested_by: "doris-es-proxy" }

---
"Simulate convert rename remove and script processors":
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - convert:
                  field: "str_code"
                  type: "integer"
                  target_field: "status_code"
              - rename:
                  field: "old_host"
                  target_field: "host"
              - remove:
                  field: "secret_token"
              - script:
                  source: "ctx._source.score = ctx._source.status_code * 2"
          docs:
            - _source:
                str_code: "200"
                old_host: "node-01"
                secret_token: "redact-me"
  - match: { docs.0.doc._source.status_code: 200 }
  - match: { docs.0.doc._source.host: "node-01" }
  - is_false: docs.0.doc._source.secret_token
  - is_false: docs.0.doc._source.old_host
  - match: { docs.0.doc._source.score: 400 }

---
"Simulate drop processor and on_failure handler":
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - convert:
                  field: "bad_int"
                  type: "integer"
                  on_failure:
                    - set:
                        field: "conversion_failed"
                        value: true
              - drop:
                  if: "ctx._source.drop_me == true"
          docs:
            - _source:
                bad_int: "not-a-number"
                drop_me: false
            - _source:
                bad_int: "10"
                drop_me: true
  - is_true: docs.0.doc._source.conversion_failed
  - is_false: docs.1.doc

---
"Index document through stored ingest pipeline":
  - do:
      indices.create:
        index: comp_pipe_write_idx
        body:
          mappings:
            properties:
              env:
                type: keyword
              code:
                type: integer
  - do:
      ingest.put_pipeline:
        id: comp_write_enrich
        body:
          processors:
            - lowercase:
                field: "env"
            - convert:
                field: "code"
                type: "integer"
  - do:
      index:
        index: comp_pipe_write_idx
        id: "p1"
        pipeline: comp_write_enrich
        body:
          env: "PRODUCTION"
          code: "201"
  - do:
      get:
        index: comp_pipe_write_idx
        id: "p1"
  - match: { _source.env: "production" }
  - match: { _source.code: 201 }

---
"Simulate Round 50 ingest processors set ignore_empty_value url_encode html_strip date array csv and foreach":
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - set:
                  field: "skip_empty"
                  value: ""
                  ignore_empty_value: true
              - url_encode:
                  field: "raw_q"
                  target_field: "{{enc_target}}"
              - html_strip:
                  field: "html_in"
                  escaped_tags: ["b"]
              - date:
                  field: "dates"
                  target_field: "parsed_dates"
                  formats: ["EEE yyyy-MM-dd hh:mm:ss.SSSSSS a"]
                  output_format: "yyyy-MM-dd"
              - csv:
                  field: "empty_csv"
                  target_fields: ["c1", "c2"]
              - foreach:
                  field: "nums"
                  processor:
                    convert:
                      field: "_ingest._value"
                      type: "integer"
                  on_failure:
                    - set:
                        field: "failed_elem"
                        value: "{{_ingest._value}}"
          docs:
            - _source:
                raw_q: "a b"
                enc_target: "encoded_q"
                html_in: "<p>hello <b>bold</b></p>"
                dates: ["Wed 2026-07-01 02:30:00.123456 PM"]
                empty_csv: ""
                nums: ["10", "bad_int", "30"]
  - is_false: docs.0.doc._source.skip_empty
  - match: { docs.0.doc._source.encoded_q: "a+b" }
  - match: { docs.0.doc._source.parsed_dates.0: "2026-07-01" }
  - match: { docs.0.doc._source.failed_elem: "bad_int" }
  - match: { docs.0.doc._source.nums.0: 10 }

---
"Simulate Round 51 grok nested brackets dissect multi-arrow kv strip_brackets convert bounds and join error":
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: "comp_invalid_proc_pipe"
        body:
          processors:
            - unknown_processor_xyz:
                field: "x"

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - grok:
                  field: "line"
                  patterns: ["%{WORD:[http][request][method]} %{NUMBER:[http][response][status]:int}"]
              - dissect:
                  field: "dline"
                  pattern: "%{a--->}%{b}"
              - kv:
                  field: "kvline"
                  field_split: " "
                  value_split: "="
                  strip_brackets: true
                  target_field: "kvout"
              - convert:
                  field: "flag_yes"
                  type: "boolean"
              - convert:
                  field: "flag_off"
                  type: "boolean"
              - convert:
                  field: "overflow_byte"
                  type: "byte"
                  on_failure:
                    - set:
                        field: "byte_overflow_caught"
                        value: true
              - join:
                  field: "not_an_array"
                  separator: ","
                  on_failure:
                    - set:
                        field: "join_error_caught"
                        value: true
          docs:
            - _source:
                line: "POST 201"
                dline: "alpha     beta"
                kvline: "(k1={v1}) [k2=<v2>]"
                flag_yes: "yes"
                flag_off: "off"
                overflow_byte: "200"
                not_an_array: "scalar_str"
  - match: { docs.0.doc._source.http.request.method: "POST" }
  - match: { docs.0.doc._source.http.response.status: 201 }
  - match: { docs.0.doc._source.a: "alpha" }
  - match: { docs.0.doc._source.b: "beta" }
  - match: { docs.0.doc._source.kvout.k1: "v1" }
  - match: { docs.0.doc._source.kvout.k2: "v2" }
  - match: { docs.0.doc._source.flag_yes: true }
  - match: { docs.0.doc._source.flag_off: false }
  - match: { docs.0.doc._source.byte_overflow_caught: true }
  - match: { docs.0.doc._source.join_error_caught: true }

---
"Round 52 ingest metadata date_index_name user_agent uri_parts registered_domain and enrich exact match":
  - do:
      ingest.processor_grok: {}
  - is_true: patterns
  - do:
      ingest.geo_ip_stats: {}
  - is_true: stats

  - do:
      indices.create:
        index: r52_comp_enrich_src
  - do:
      index:
        index: r52_comp_enrich_src
        id: "1"
        body: { "code": "US-EAST-1", "region": "Virginia" }
  - do:
      index:
        index: r52_comp_enrich_src
        id: "2"
        body: { "code": "US-EAST-1-OTHER", "region": "Other" }
  - do:
      enrich.put_policy:
        name: r52_comp_enrich_pol
        body:
          match:
            indices: r52_comp_enrich_src
            match_field: code
            enrich_fields: ["region"]
  - match: { acknowledged: true }
  - do:
      catch: bad_request
      enrich.put_policy:
        name: r52_comp_enrich_pol
        body:
          match:
            indices: r52_comp_enrich_src
            match_field: code
            enrich_fields: ["region"]
  - do:
      enrich.execute_policy:
        name: r52_comp_enrich_pol
  - is_true: status

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - date_index_name:
                  field: "ts"
                  index_name_prefix: "ev-"
                  date_rounding: "d"
                  index_name_format: "UNIX"
              - user_agent:
                  field: "ua"
              - uri_parts:
                  field: "uri"
              - registered_domain:
                  field: "fqdn"
              - enrich:
                  policy_name: "r52_comp_enrich_pol"
                  field: "code"
                  target_field: "enriched"
          docs:
            - _source:
                ts: 1704067200000
                ua: "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
                uri: "bob:pw@host.example.com:9000/dir/.profile"
                fqdn: "a.b.example.co.uk."
                code: "US-EAST-1"
  - match: { docs.0.doc._index: "ev-1704067200" }
  - match: { docs.0.doc._source.user_agent.os.name: "Android" }
  - match: { docs.0.doc._source.user_agent.os.version: "14" }
  - match: { docs.0.doc._source.url.username: "bob" }
  - match: { docs.0.doc._source.url.domain: "host.example.com" }
  - is_false: docs.0.doc._source.url.extension
  - match: { docs.0.doc._source.fqdn.registered_domain: "example.co.uk" }
  - match: { docs.0.doc._source.enriched.region: "Virginia" }

---
"Round 53 Ingest Validation, Date Formats, Murmur3 Fingerprint, Attachment/UA Properties, and KV Escapes":
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r53_bad_null_proc
        body:
          processors:
            - set: null

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r53_bad_convert_type
        body:
          processors:
            - convert:
                field: "a"
                type: "invalid_type"

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - date:
                  field: "epoch_ms"
                  formats: ["epoch_millis"]
                  target_field: "parsed_epoch"
              - date:
                  field: "uuuu_date"
                  formats: ["uuuu-MM-dd'T'HH:mm:ss,SSSZ"]
                  target_field: "parsed_uuuu"
              - fingerprint:
                  fields: ["msg"]
                  method: "Murmur3@2.0"
                  target_field: "fp_murmur"
              - attachment:
                  field: "b64"
                  indexed_chars_field: "max_len"
                  properties: ["content", "content_length"]
              - user_agent:
                  field: "ua"
                  properties: ["name", "major", "minor"]
              - kv:
                  field: "kv_str"
                  field_split: " "
                  value_split: "="
                  strip_brackets: true
          docs:
            - _source:
                epoch_ms: 1704067200000
                uuuu_date: "2024-01-01T00:00:00,000+0000"
                msg: "hello"
                b64: "aGVsbG8gd29ybGQ="
                max_len: 5
                ua: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Chrome/120.1.2"
                kv_str: "[env]=\"prod\\\"1\" (tier)=[backend]"
  - match: { docs.0.doc._source.parsed_epoch: "2024-01-01T00:00:00Z" }
  - match: { docs.0.doc._source.parsed_uuuu: "2024-01-01T00:00:00Z" }
  - is_true: docs.0.doc._source.fp_murmur
  - match: { docs.0.doc._source.attachment.content: "hello" }
  - is_false: docs.0.doc._source.attachment.content_type
  - match: { docs.0.doc._source.user_agent.name: "Chrome" }
  - match: { docs.0.doc._source.user_agent.major: "120" }
  - is_false: docs.0.doc._source.user_agent.original
  - match: { docs.0.doc._source.env: "prod\"1" }
  - match: { docs.0.doc._source.tier: "backend" }

---
"Round 54 terminate, circle, grok keep_empty_captures/ecs_compatibility, and kv transform_key":
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - kv:
                  field: "raw_kv"
                  field_split: "[&,]"
                  value_split: "[=:]"
                  transform_key: "lowercase"
              - grok:
                  field: "raw_log"
                  patterns: ["%{HOSTPORT:hp} %{UNIXPATH:path}(?: %{WORD:opt})?"]
                  keep_empty_captures: true
              - circle:
                  field: "area"
                  target_field: "area_poly"
                  shape_type: "shape"
                  error_distance: 10.0
              - terminate:
                  if: "ctx.skip_rest == true"
              - set:
                  field: "after_terminate"
                  value: "should_not_run"
          docs:
            - _source:
                raw_kv: "TAG=alpha&tag:beta,Env=Prod"
                raw_log: "10.0.0.1:8080 /var/log/syslog"
                area: "CIRCLE (0 0 10)"
                skip_rest: true
  - match: { docs.0.doc._source.tag.0: "alpha" }
  - match: { docs.0.doc._source.tag.1: "beta" }
  - match: { docs.0.doc._source.env: "Prod" }
  - match: { docs.0.doc._source.hp: "10.0.0.1:8080" }
  - match: { docs.0.doc._source.path: "/var/log/syslog" }
  - is_false: docs.0.doc._source.opt
  - is_false: docs.0.doc._source.after_terminate
  - match: { docs.0.doc._source.area_poly: /^POLYGON \(\(.+\)\)$/ }

---
"Round 55 dissect suffix matching, community_id ICMP equivalence, csv quoted trim preservation, and uri_parts opaque URI":
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r55_bad_dissect
        body:
          processors:
            - dissect:
                field: "msg"
                pattern: ""

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - dissect:
                  field: "bracketed"
                  pattern: "[%{inner}]"
              - csv:
                  field: "csv_line"
                  target_fields: ["c1", "c2"]
                  trim: true
              - uri_parts:
                  field: "mailto_uri"
                  target_field: "parsed_uri"
              - community_id:
                  source_ip: "src_ip"
                  destination_ip: "dst_ip"
                  transport: "proto"
                  icmp_type: "icmp_t"
                  icmp_code: "icmp_c"
                  target_field: "cid"
              - network_direction:
                  source_ip: "src_ip"
                  destination_ip: "dst_ip"
                  internal_networks: ["private"]
                  target_field: "net_dir"
          docs:
            - _source:
                bracketed: "[hello]world]"
                csv_line: '  "  keep_inner_spaces  " ,  trim_outer  '
                mailto_uri: "mailto:alice@example.com"
                src_ip: "192.168.1.10"
                dst_ip: "8.8.8.8"
                proto: "icmp"
                icmp_t: 8
                icmp_c: 0
            - _source:
                bracketed: "[x]"
                csv_line: "a,b"
                mailto_uri: "mailto:bob@example.com"
                src_ip: "8.8.8.8"
                dst_ip: "192.168.1.10"
                proto: "icmp"
                icmp_t: 0
                icmp_c: 0
  - match: { docs.0.doc._source.inner: "hello]world" }
  - match: { docs.0.doc._source.c1: "  keep_inner_spaces  " }
  - match: { docs.0.doc._source.c2: "trim_outer" }
  - match: { docs.0.doc._source.parsed_uri.scheme: "mailto" }
  - match: { docs.0.doc._source.net_dir: "outbound" }
  - set: { docs.0.doc._source.cid: icmp_req_cid }
  - match: { docs.1.doc._source.cid: $icmp_req_cid }

---
"Round 56 foreach/on_failure ctx._ingest metadata, reroute validation/fallback/short-circuiting, and json duplicate keys":
  # F28: reroute processor validation errors
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r56_bad_reroute_dest_and_dataset
        body:
          processors:
            - reroute:
                destination: "logs-custom"
                dataset: "app"

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r56_bad_reroute_static_hyphen
        body:
          processors:
            - reroute:
                dataset: "bad-dataset"

  # F29: json processor validation errors
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r56_bad_json_conflict_strategy
        body:
          processors:
            - json:
                field: "payload"
                add_to_root: true
                add_to_root_conflict_strategy: "invalid_strategy"

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r56_bad_json_strategy_without_root
        body:
          processors:
            - json:
                field: "payload"
                add_to_root_conflict_strategy: "merge"

  # F27: foreach if reading ctx._ingest._value & ctx._ingest.timestamp, plus nested on_failure_pipeline propagation
  - do:
      ingest.put_pipeline:
        id: r56_child_fail_pipe
        body:
          processors:
            - fail:
                message: "child pipeline failure"
  - match: { acknowledged: true }

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - foreach:
                  field: "scores"
                  processor:
                    script:
                      if: "ctx._ingest._value >= 10 && ctx._ingest.timestamp != null"
                      source: "ctx._ingest._value = ctx._ingest._value * 10"
              - pipeline:
                  name: "r56_child_fail_pipe"
            on_failure:
              - set:
                  if: "ctx._ingest.on_failure_pipeline == 'r56_child_fail_pipe'"
                  field: "caught_from_pipeline"
                  value: "{{_ingest.on_failure_pipeline}}"
              - set:
                  if: "ctx._ingest.on_failure_processor_type == 'fail'"
                  field: "caught_proc_type"
                  value: "{{_ingest.on_failure_processor_type}}"
          docs:
            - _source:
                scores: [5, 10, 25]
  - match: { docs.0.doc._source.scores: [5, 100, 250] }
  - match: { docs.0.doc._source.caught_from_pipeline: "r56_child_fail_pipe" }
  - match: { docs.0.doc._source.caught_proc_type: "fail" }
  - is_unset: docs.0.doc._source._ingest

  # F28: reroute array fallback (skipping missing/null), dynamic '-' -> '_' sanitization, and pipeline short-circuiting
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - set:
                  field: "before_reroute"
                  value: true
              - reroute:
                  dataset: ["missing_ds", "null_ds", "svc_ds"]
                  namespace: ["missing_ns", "env_ns"]
              - set:
                  field: "after_reroute"
                  value: "continued"
          docs:
            - _index: "logs-generic-default"
              _source:
                null_ds: null
                svc_ds: "billing-api"
                env_ns: "prod-east"
            - _index: "logs-billing_api-prod_east"
              _source:
                svc_ds: "billing-api"
                env_ns: "prod-east"
  - match: { docs.0.doc._index: "logs-billing_api-prod_east" }
  - match: { docs.0.doc._source.before_reroute: true }
  - is_unset: docs.0.doc._source.after_reroute
  - match: { docs.1.doc._index: "logs-billing_api-prod_east" }
  - match: { docs.1.doc._source.after_reroute: "continued" }

  # F29: json allow_duplicate_keys default false rejection vs allow_duplicate_keys: true + add_to_root_conflict_strategy: merge
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - json:
                  field: "dup_payload"
                  target_field: "parsed_dup"
                  on_failure:
                    - set:
                        field: "dup_rejected"
                        value: true
              - json:
                  field: "merge_payload"
                  allow_duplicate_keys: true
                  add_to_root: true
                  add_to_root_conflict_strategy: "merge"
          docs:
            - _source:
                dup_payload: '{"user":"alice","user":"admin"}'
                merge_payload: '{"role":"viewer","role":"editor","meta":{"shared":"new","added":7}}'
                meta:
                  keep: "preserved"
                  shared: "old"
  - match: { docs.0.doc._source.dup_rejected: true }
  - is_unset: docs.0.doc._source.parsed_dup
  - match: { docs.0.doc._source.role: "editor" }
  - match: { docs.0.doc._source.meta.keep: "preserved" }
  - match: { docs.0.doc._source.meta.shared: "new" }
  - match: { docs.0.doc._source.meta.added: 7 }

---
"Round 57 Ingest Processor Validation, Java Named Regex Groups, TAI64N/Ordinal Date & Strict Convert Compliance":
  # F27: Pipeline processor configuration validation rejections (sort, split, kv, date, fingerprint)
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r57_bad_sort_order
        body:
          processors:
            - sort:
                field: "arr"
                order: "sideways"

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r57_bad_split_regex
        body:
          processors:
            - split:
                field: "raw"
                separator: "[unclosed"

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r57_bad_kv_inc_exc
        body:
          processors:
            - kv:
                field: "raw"
                field_split: " "
                value_split: "="
                include_keys: ["a"]
                exclude_keys: ["b"]

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r57_bad_date_formats
        body:
          processors:
            - date:
                field: "ts"
                formats: [""]

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r57_bad_fingerprint_fields
        body:
          processors:
            - fingerprint:
                fields: []

  # F27: date processor TAI64N, ordinal day (DDD / ordinal_date_no_millis), and NaN/Infinity rejection
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - date:
                  field: "tai_ts"
                  formats: ["TAI64N"]
                  target_field: "parsed_tai"
              - date:
                  field: "ord_ts"
                  formats: ["uuuu-DDD'T'HH:mm:ssZ"]
                  target_field: "parsed_ord"
              - date:
                  field: "builtin_ord"
                  formats: ["ordinal_date_no_millis"]
                  target_field: "parsed_builtin_ord"
              - date:
                  field: "nan_epoch"
                  formats: ["UNIX"]
                  on_failure:
                    - set:
                        field: "nan_rejected"
                        value: true
              - date:
                  field: "inf_epoch"
                  formats: ["UNIX_MS"]
                  on_failure:
                    - set:
                        field: "inf_rejected"
                        value: true
          docs:
            - _source:
                tai_ts: "@400000006592008a00000000"
                ord_ts: "2024-032T00:00:00+0000"
                builtin_ord: "2024-060T12:30:00Z"
                nan_epoch: "NaN"
                inf_epoch: "Infinity"
  - match: { docs.0.doc._source.parsed_tai: '/^2024-01-01T00:00:00/' }
  - match: { docs.0.doc._source.parsed_ord: '/^2024-02-01/' }
  - match: { docs.0.doc._source.parsed_builtin_ord: '/^2024-02-29T12:30:00/' }
  - match: { docs.0.doc._source.nan_rejected: true }
  - match: { docs.0.doc._source.inf_rejected: true }

  # F28: gsub/split Java named capture groups (?<name>...), ${name}, literal escapes, and invalid replacement on_failure
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - gsub:
                  field: "named_src"
                  pattern: "(?<dept>[a-z]+)-(?<code>\\d+)"
                  replacement: "${code}\\-${dept}\\$\\\\[$0]"
              - split:
                  field: "pipe_str"
                  separator: "|"
              - gsub:
                  field: "bad_group"
                  pattern: "(\\w+)"
                  replacement: "$9"
                  on_failure:
                    - set:
                        field: "bad_group_caught"
                        value: true
              - gsub:
                  field: "bad_dollar"
                  pattern: "(\\w+)"
                  replacement: "$unknown"
                  on_failure:
                    - set:
                        field: "bad_dollar_caught"
                        value: true
          docs:
            - _source:
                named_src: "eng-404"
                pipe_str: "x|y|z"
                bad_group: "abc"
                bad_dollar: "abc"
  - match: { docs.0.doc._source.named_src: '404-eng$\[eng-404]' }
  - length: { docs.0.doc._source.pipe_str: 3 }
  - match: { docs.0.doc._source.bad_group_caught: true }
  - match: { docs.0.doc._source.bad_dollar_caught: true }

  # F29: convert strict numeric vs string parsing, non-trimming auto preservation, and IPv6 canonicalization
  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - convert:
                  field: "sci_int"
                  type: "integer"
                  on_failure:
                    - set: { field: "sci_int_err", value: true }
              - convert:
                  field: "pad_int"
                  type: "integer"
                  on_failure:
                    - set: { field: "pad_int_err", value: true }
              - convert:
                  field: "int_bool"
                  type: "boolean"
                  on_failure:
                    - set: { field: "int_bool_err", value: true }
              - convert:
                  field: "yes_bool"
                  type: "boolean"
              - convert:
                  field: "ip_v6"
                  type: "ip"
              - convert:
                  field: "auto_float"
                  type: "auto"
              - convert:
                  field: "auto_str_int"
                  type: "auto"
              - convert:
                  field: "auto_padded"
                  type: "auto"
          docs:
            - _source:
                sci_int: "1e2"
                pad_int: " 42 "
                int_bool: 1
                yes_bool: "yes"
                ip_v6: "2001:0db8:0000:0000:0000:0000:0000:0001"
                auto_float: 2.5
                auto_str_int: "77"
                auto_padded: " 77 "
  - match: { docs.0.doc._source.sci_int_err: true }
  - match: { docs.0.doc._source.pad_int_err: true }
  - match: { docs.0.doc._source.int_bool_err: true }
  - match: { docs.0.doc._source.yes_bool: true }
  - match: { docs.0.doc._source.ip_v6: "2001:db8::1" }
  - match: { docs.0.doc._source.auto_float: 2.5 }
  - match: { docs.0.doc._source.auto_str_int: 77 }
  - match: { docs.0.doc._source.auto_padded: " 77 " }

---
"Round 58 Ingest Pipeline Cycles, Terminate Scope, Nested Foreach, CSV, Dissect & Reroute":
  # F27: Direct & indirect pipeline cycle detection at PUT time
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r58_pipe_self
        body:
          processors:
            - pipeline:
                name: "r58_pipe_self"

  - do:
      ingest.put_pipeline:
        id: r58_pipe_cycle_b
        body:
          processors:
            - pipeline:
                name: "r58_pipe_cycle_a"
  - match: { acknowledged: true }

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r58_pipe_cycle_a
        body:
          processors:
            - pipeline:
                name: "r58_pipe_cycle_b"

  # F27: Sub-pipeline terminate halts outer pipeline while index.final_pipeline still runs
  - do:
      ingest.put_pipeline:
        id: r58_pipe_sub_term
        body:
          processors:
            - set:
                field: "from_sub"
                value: "yes"
            - terminate: {}
            - set:
                field: "sub_after_term"
                value: "should_not_run"
  - match: { acknowledged: true }

  - do:
      ingest.put_pipeline:
        id: r58_pipe_outer_term
        body:
          processors:
            - pipeline:
                name: "r58_pipe_sub_term"
            - set:
                field: "outer_after_sub"
                value: "should_not_run"
  - match: { acknowledged: true }

  - do:
      ingest.put_pipeline:
        id: r58_pipe_final_term
        body:
          processors:
            - set:
                field: "from_final"
                value: "ran"
  - match: { acknowledged: true }

  - do:
      indices.create:
        index: r58_ingest_term_idx
        body:
          settings:
            index:
              default_pipeline: "r58_pipe_outer_term"
              final_pipeline: "r58_pipe_final_term"
  - match: { acknowledged: true }

  - do:
      index:
        index: r58_ingest_term_idx
        id: "1"
        refresh: true
        body:
          seed: "ok"

  - do:
      get:
        index: r58_ingest_term_idx
        id: "1"
  - match: { _source.from_sub: "yes" }
  - is_unset: _source.sub_after_term
  - is_unset: _source.outer_after_sub
  - match: { _source.from_final: "ran" }

  # F27: Nested foreach restores outer _ingest._value when inner foreach fails with ignore_failure: true
  - do:
      ingest.put_pipeline:
        id: r58_nested_foreach_inner
        body:
          processors:
            - foreach:
                field: "missing_inner_array"
                ignore_failure: true
                processor:
                  uppercase:
                    field: "_ingest._value"
            - script:
                source: "ctx.restored = ctx.restored == null ? [] : ctx.restored; ctx.restored.add(ctx._ingest._value.name)"
  - match: { acknowledged: true }

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - foreach:
                  field: "groups"
                  processor:
                    pipeline:
                      name: "r58_nested_foreach_inner"
          docs:
            - _source:
                groups:
                  - { name: "g1" }
                  - { name: "g2" }
  - length: { docs.0.doc._source.restored: 2 }
  - match: { docs.0.doc._source.restored.0: "g1" }
  - match: { docs.0.doc._source.restored.1: "g2" }

  # F28: CSV duplicate target_fields rejection, empty line, short row, TSV empty cells, and quoted empty string
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r58_csv_dup
        body:
          processors:
            - csv:
                field: "line"
                target_fields: ["a", "b", "a"]

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - csv:
                  if: "ctx.mode == 'csv_emp'"
                  field: "raw"
                  target_fields: ["c1", "c2", "c3", "c4"]
                  empty_value: "NA"
              - csv:
                  if: "ctx.mode == 'tsv'"
                  field: "raw"
                  separator: "\t"
                  target_fields: ["t1", "t2", "t3"]
                  empty_value: "EMPTY"
              - csv:
                  if: "ctx.mode == 'quoted'"
                  field: "raw"
                  target_fields: ["q1", "q2", "q3"]
          docs:
            - _source: { mode: "csv_emp", raw: "\n" }
            - _source: { mode: "csv_emp", raw: "x,y" }
            - _source: { mode: "tsv", raw: "\t\t" }
            - _source: { mode: "quoted", raw: 'a,"",c' }
  - is_unset: docs.0.doc._source.c1
  - match: { docs.1.doc._source.c1: "x" }
  - match: { docs.1.doc._source.c2: "y" }
  - is_unset: docs.1.doc._source.c3
  - is_unset: docs.1.doc._source.c4
  - match: { docs.2.doc._source.t1: "EMPTY" }
  - match: { docs.2.doc._source.t2: "EMPTY" }
  - match: { docs.2.doc._source.t3: "EMPTY" }
  - match: { docs.3.doc._source.q1: "a" }
  - match: { docs.3.doc._source.q2: "" }
  - match: { docs.3.doc._source.q3: "c" }

  # F29: Dissect grammar validation, right-padding ->, and reroute ignore_missing / processor halt
  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r58_bad_dissect_ref
        body:
          processors:
            - dissect:
                field: "msg"
                pattern: "%{&dangling}"

  - do:
      catch: bad_request
      ingest.put_pipeline:
        id: r58_bad_dissect_adj
        body:
          processors:
            - dissect:
                field: "msg"
                pattern: "%{a}%{b}"

  - do:
      ingest.put_pipeline:
        id: r58_good_dissect
        body:
          processors:
            - dissect:
                field: "msg"
                pattern: "%{} %{?ignored->} %{col1->} %{*k} %{&k}"
  - match: { acknowledged: true }

  - do:
      ingest.simulate:
        id: r58_good_dissect
        body:
          docs:
            - _source:
                msg: "DROP SKIP     val_one      dyn_key dyn_val"
  - match: { docs.0.doc._source.col1: "val_one" }
  - match: { docs.0.doc._source.dyn_key: "dyn_val" }
  - is_unset: docs.0.doc._source.ignored

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - reroute:
                  destination: "logs-{{missing_target}}"
                  ignore_missing: false
          docs:
            - _index: "logs-generic-default"
              _source: { msg: "hello" }
  - is_true: docs.0.error

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - reroute:
                  destination: "logs-{{missing_target}}"
          docs:
            - _index: "logs-generic-default"
              _source: { msg: "hello" }
  - is_unset: docs.0.error
  - match: { docs.0.doc._index: "logs-generic-default" }

  - do:
      ingest.simulate:
        body:
          pipeline:
            processors:
              - reroute:
                  destination: "logs-generic-default"
              - set:
                  field: "after_reroute"
                  value: true
          docs:
            - _index: "logs-generic-default"
              _source: { msg: "hello" }
  - is_unset: docs.0.doc._source.after_reroute



