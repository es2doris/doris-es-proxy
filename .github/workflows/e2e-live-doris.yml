name: Live Apache Doris E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-doris-e2e:
    name: E2E against Live Apache Doris Container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            e2e/sdkconformance/go.sum

      - name: Build doris-es-proxy
        run: make build

      - name: Start Apache Doris 4.1.3 FE+BE Container
        run: |
          sudo sysctl -w vm.max_map_count=2000000
          docker run -d --name doris-fe-be --network host apache/doris:all-in-one-4.1.3
          echo "Waiting for Apache Doris FE & BE to become ready..."
          for _ in $(seq 1 90); do
            OUT=$(mysql -h 127.0.0.1 -P 9030 -u root -e "SHOW BACKENDS\G" 2>/dev/null || true)
            if echo "$OUT" | grep -q "Alive: true" && ! echo "$OUT" | grep -q "TotalCapacity: 0.000"; then
              echo "Apache Doris FE+BE is alive and BE storage capacity is reported!"
              break
            fi
            sleep 3
          done
          mysql -h 127.0.0.1 -P 9030 -u root -e "SHOW BACKENDS\G"
          ./bin/doris-es-proxy doctor

      - name: Run Live Apache Doris E2E Test Suite
        run: make test-e2e

      - name: Run Official Go SDK v8 Conformance against Live Apache Doris
        run: |
          ./bin/doris-es-proxy \
            --listen 127.0.0.1:9200 \
            --doris-dsn "root:@tcp(127.0.0.1:9030)/?interpolateParams=true&timeout=5s&readTimeout=30s&writeTimeout=30s" \
            --doris-http "http://127.0.0.1:8030" \
            --doris-db "es_sdk_e2e" \
            --es-version "8.15.5" \
            --log-sql >/tmp/doris-es-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true; wait "$PROXY_PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9200/healthz || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "doris-es-proxy failed to become ready on /healthz:"
            cat /tmp/doris-es-proxy.log || true
            exit 1
          fi
          bash scripts/fetch-conformance-specs.sh
          DORIS_ES_PROXY_URL=http://127.0.0.1:9200 go -C e2e/sdkconformance test -race -count=1 -v ./...

      - name: Run Curated Upstream Elastic YAML Conformance against Live Apache Doris
        env:
          DORIS_E2E_DSN: "root:@tcp(127.0.0.1:9030)/?interpolateParams=true&timeout=5s&readTimeout=30s&writeTimeout=30s"
          DORIS_E2E_HTTP: "http://127.0.0.1:8030"
          DORIS_E2E_DB: "es_yaml_e2e"
          DORIS_LIVE_YAML_MIN_PASSED: "1400"
        run: go test -v -race -count=1 -timeout 20m ./e2e/... -run TestLiveDorisUpstreamYAMLConformance_E2E

      - name: Dump Doris logs on failure
        if: failure()
        run: |
          docker logs doris-fe-be --tail 200
          if [ -f /tmp/doris-es-proxy.log ]; then
            echo "=== doris-es-proxy.log ==="
            tail -n 200 /tmp/doris-es-proxy.log
          fi
