name: Live Apache Doris E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-doris-e2e:
    name: E2E against Live Apache Doris Container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build doris-es-proxy
        run: make build

      - name: Start Apache Doris 4.1.3 FE+BE Container
        run: |
          sudo sysctl -w vm.max_map_count=2000000
          docker run -d --name doris-fe-be --network host apache/doris:all-in-one-4.1.3
          echo "Waiting for Apache Doris FE & BE to become ready..."
          for _ in $(seq 1 90); do
            OUT=$(mysql -h 127.0.0.1 -P 9030 -u root -e "SHOW BACKENDS\G" 2>/dev/null || true)
            if echo "$OUT" | grep -q "Alive: true" && ! echo "$OUT" | grep -q "TotalCapacity: 0.000"; then
              echo "Apache Doris FE+BE is alive and BE storage capacity is reported!"
              break
            fi
            sleep 3
          done
          mysql -h 127.0.0.1 -P 9030 -u root -e "SHOW BACKENDS\G"
          ./bin/doris-es-proxy doctor

      - name: Run Live Apache Doris E2E Test Suite
        run: make test-e2e

      - name: Dump Doris logs on failure
        if: failure()
        run: docker logs doris-fe-be --tail 200
