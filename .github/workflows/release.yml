name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release-binaries-and-image:
    name: Build Release Binaries & GHCR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build cross-platform release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out_dir="dist/doris-es-proxy_${VERSION}_${os}_${arch}"
              mkdir -p "${out_dir}"
              GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build \
                -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
                -o "${out_dir}/doris-es-proxy" ./cmd/doris-es-proxy
              cp LICENSE NOTICE README.md "${out_dir}/"
              tar -C dist -czf "dist/doris-es-proxy_${VERSION}_${os}_${arch}.tar.gz" "doris-es-proxy_${VERSION}_${os}_${arch}"
              rm -rf "${out_dir}"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Build & Push GHCR Container Image (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          docker build \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"
