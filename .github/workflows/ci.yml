name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o doris-es-proxy ./cmd/doris-es-proxy

      - name: Vet
        run: go vet ./...

      - name: Test with race detector & coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./... -v

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT=$(gofmt -s -l .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$GOFMT_OUTPUT"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  security:
    name: Security (govulncheck, gosec, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run gosec SAST
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

      - name: Run gitleaks secret scan
        run: go run github.com/zricethezav/gitleaks/v8@latest detect --source . --no-git -v

  smoke-and-docker:
    name: Quickstart, CLI & Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run quickstart demo (in-memory Doris SQL engine)
        run: bash examples/quickstart.sh

      - name: Verify CLI subcommands (version, transpile, ddl)
        run: |
          ./bin/doris-es-proxy version
          echo '{"query":{"dis_max":{"queries":[{"match":{"name":"orders"}}]}},"aggs":{"top":{"top_hits":{"size":1}}}}' \
            | ./bin/doris-es-proxy transpile --index table_search_index
          echo '{"mappings":{"properties":{"name":{"type":"text"},"serviceType":{"type":"keyword"}}}}' \
            | ./bin/doris-es-proxy ddl --index table_search_index

      - name: Build & verify distroless Docker image
        run: |
          docker build -t es2doris/doris-es-proxy:ci .
          docker run --rm es2doris/doris-es-proxy:ci version
