name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o doris-es-proxy ./cmd/doris-es-proxy

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./... -v

      - name: Fuzz seed regression
        run: go test -run='^Fuzz' ./...

      - name: Merged coverage gate (>= 82.0%)
        run: |
          rm -rf /tmp/covdata
          mkdir -p /tmp/covdata
          go test -cover -coverpkg=./... ./... -args -test.gocoverdir=/tmp/covdata
          go tool covdata textfmt -i=/tmp/covdata -o=coverage.out
          TOTAL_LINE=$(go tool cover -func=coverage.out | tail -1)
          echo "$TOTAL_LINE"
          PCT=$(echo "$TOTAL_LINE" | awk '{gsub("%","",$3); print $3}')
          awk -v pct="$PCT" 'BEGIN { if (pct + 0 < 82.0) { printf "Coverage %.1f%% is below 82.0%% threshold\n", pct; exit 1 } }'

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT=$(gofmt -s -l .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$GOFMT_OUTPUT"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  security:
    name: Security (govulncheck, gosec, gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run gosec SAST
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

      - name: Run gitleaks secret scan
        run: go run github.com/zricethezav/gitleaks/v8@latest detect --source . --no-git -v

  smoke-and-docker:
    name: Quickstart, CLI & Docker Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable

      - name: Run quickstart demo (in-memory Doris SQL engine)
        run: bash examples/quickstart.sh

      - name: Verify CLI subcommands (version, transpile, ddl)
        run: |
          ./bin/doris-es-proxy version
          echo '{"query":{"dis_max":{"queries":[{"match":{"name":"orders"}}]}},"aggs":{"top":{"top_hits":{"size":1}}}}' \
            | ./bin/doris-es-proxy transpile --index table_search_index
          echo '{"mappings":{"properties":{"name":{"type":"text"},"serviceType":{"type":"keyword"}}}}' \
            | ./bin/doris-es-proxy ddl --index table_search_index

      - name: Build & verify distroless Docker image and deployment assets
        run: |
          jq empty deploy/grafana/doris-es-proxy-dashboard.json
          docker build -t es2doris/doris-es-proxy:ci .
          docker run --rm es2doris/doris-es-proxy:ci version | grep -q "v0.21.0"

  elastic-conformance:
    name: Upstream Elastic Conformance & Go SDK v8
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            e2e/sdkconformance/go.sum

      - name: Fetch upstream Elastic rest-api-spec & elasticsearch-specification
        run: bash scripts/fetch-conformance-specs.sh

      - name: Run upstream Elastic rest-api-spec & wire-schema conformance
        run: |
          CONFORMANCE_REQUIRE_UPSTREAM=1 \
          CONFORMANCE_MIN_V7_PASSED=1980 \
          CONFORMANCE_MIN_V8_PASSED=4500 \
          CONFORMANCE_SUMMARY_MD="$GITHUB_STEP_SUMMARY" \
          CONFORMANCE_OUT_JSON="/tmp/conformance-scorecard.json" \
            go test -race -count=1 -v ./pkg/compliance -run 'TestUpstream|TestSpecSchemaValidatorLiveUpstreamSchema'

      - name: Vet official Go SDK v8 conformance module
        run: go -C e2e/sdkconformance vet ./...

      - name: Run official elastic/go-elasticsearch/v8 conformance suite
        run: go -C e2e/sdkconformance test -race -count=1 -v ./...
